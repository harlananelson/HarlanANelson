<title>Languages — speech drills</title>
<style>
  /* Public multi-language shell. Existing drill pages load in iframes.
     Last-used language is remembered in localStorage. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #f7f6f2; color: #28251d;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #tabs {
    display: flex; background: #fff; border-bottom: 1px solid #d4d1ca;
    padding-top: env(safe-area-inset-top, 0);
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    z-index: 2;
  }
  #tabs button {
    flex: 1; background: none; border: 0; color: #6f6d68; cursor: pointer;
    padding: 12px 6px 10px; font-size: 13px; font-weight: 500;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    touch-action: manipulation; border-bottom: 3px solid transparent;
  }
  #tabs button .code { font-size: 11px; opacity: .75; letter-spacing: 0.04em; }
  #tabs button.sel {
    color: #01696f; border-bottom-color: #01696f; font-weight: 600;
  }
  #views { position: relative; flex: 1; min-height: 0; background: #f7f6f2; }
  .view {
    position: absolute; inset: 0; display: none;
    border: 0; width: 100%; height: 100%; background: #f7f6f2;
  }
  .view.active { display: block; }
  #hint {
    display: none; font-size: 12px; color: #6f6d68; text-align: center;
    padding: 6px 10px; background: #f1efea; border-bottom: 1px solid #e4e0d8;
  }
  #hint.show { display: block; }
</style>
</head>
<body>

<nav id="tabs" aria-label="Language"></nav>
<div id="hint">Your last language is remembered on this device.</div>
<div id="views"></div>

<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var LANGS = [
    { id: "es", label: "Español",  code: "ES", url: "./spanish-speech-drill.html" },
    { id: "en", label: "English",  code: "EN", url: "./english-speech-drill.html" },
    { id: "ja", label: "日本語",    code: "JA", url: "./japanese-speech-drill.html" },
    { id: "ko", label: "한국어",    code: "KO", url: "./korean-speech-drill.html" },
    { id: "sw", label: "Kiswahili", code: "SW", url: "./swahili-speech-drill.html" }
  ];

  var STORAGE_KEY = "languages_last";
  var active = null;
  try { active = localStorage.getItem(STORAGE_KEY); } catch (e) {}

  // Deep link: ?lang=es|en|ja|ko|sw
  try {
    var q = new URLSearchParams(location.search).get("lang");
    if (q) active = q;
  } catch (e) {}

  function build() {
    var views = $("views"); views.innerHTML = "";
    var tabs = $("tabs"); tabs.innerHTML = "";
    LANGS.forEach(function (L) {
      var f = document.createElement("iframe");
      f.className = "view"; f.id = "view-" + L.id;
      f.setAttribute("allow", "microphone; autoplay; clipboard-write");
      f.setAttribute("title", L.label + " speech drill");
      f.dataset.src = L.url;
      views.appendChild(f);

      var t = document.createElement("button");
      t.type = "button";
      t.id = "tab-" + L.id;
      t.innerHTML = '<span>' + L.label + '</span><span class="code">' + L.code + '</span>';
      t.onclick = function () { show(L.id); };
      tabs.appendChild(t);
    });

    var ids = LANGS.map(function (L) { return L.id; });
    if (ids.indexOf(active) < 0) active = "es";
    show(active);

    // One-time tip if first visit
    try {
      if (!localStorage.getItem("languages_hint_seen")) {
        $("hint").className = "show";
        localStorage.setItem("languages_hint_seen", "1");
        setTimeout(function () { $("hint").className = ""; }, 4000);
      }
    } catch (e) {}
  }

  function show(id) {
    active = id;
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    // Keep URL shareable without reload thrash
    try {
      if (history.replaceState) {
        var u = new URL(location.href);
        u.searchParams.set("lang", id);
        history.replaceState(null, "", u.pathname + u.search);
      }
    } catch (e) {}

    LANGS.forEach(function (L) {
      var v = $("view-" + L.id), t = $("tab-" + L.id);
      var on = L.id === id;
      if (v) {
        if (on && !v.getAttribute("src") && v.dataset.src) {
          v.src = v.dataset.src;
        }
        v.classList.toggle("active", on);
      }
      if (t) t.classList.toggle("sel", on);
    });
  }

  build();
})();
</script>
</body>
