    if (!v.frames.length || (v.total / 16000) * 1000 < 300) { opts.onDone(null); return; }
    var merged = new Float32Array(v.total), off = 0;
    v.frames.forEach(function (f) { merged.set(f, off); off += f.length; });
    opts.onDone(encodeWav16k(merged));
  }

  // Tap-to-talk / hands-free both run through the same engine.
  // Hands-free hangMs ~2s of silence ends a turn (1.4s was cutting mid-thought).
  // maxMs is the longest single utterance before a forced end.
  function startRec() {
    capture({
      hangMs: handsFree ? 2000 : 60000,   // hands-free auto-ends; tap ends on tap
      maxMs: handsFree ? 90000 : 60000,
      onStart: function () {
        $("talkBtn").className = "rec";
        setTalkLabel("⏹", handsFree ? "Listening… (auto)" : "Stop and send");
        // iOS can leave the AudioContext suspended after TTS; nudge it awake
        // so VAD frames actually arrive for the next turn.
        try {
          if (capState && capState.ctx && capState.ctx.resume) capState.ctx.resume();
        } catch (e) {}
      },
      onFail: function () {
        $("talkBtn").className = "";
        setTalkLabel("🎤", handsFree ? "Tap to start talking" : "Tap to talk");
        // Permission / device glitch: keep the mode on, let the user tap again
        // rather than silently dying for the rest of the session.
        if (handsFree) setStatus("Mic paused — tap 🎤 to listen again.", true);
      },
      onDone: function (wav) {
        $("talkBtn").className = "";
        setTalkLabel(handsFree ? "⏳" : "🎤", handsFree ? "Thinking…" : "Tap to talk");
        uploadClip(wav);
      }
    });
  }
  function stopRec() {
    if (captureRunning()) captureStop();
    else { $("talkBtn").className = ""; setTalkLabel("🎤", "Tap to talk"); }
  }
  function uploadClip(blob) {
    // null = nothing above the noise floor.
    if (!blob) {
      pipelineBusy = false;
      setStatus(handsFree ? "Listening…" : "Didn't catch that — tap and speak.",
                !handsFree);
      if (handsFree) scheduleRelisten(300);   // empty clip: keep the loop alive
      return;
    }
    pipelineBusy = true;
    setStatus("Transcribing…");
    var fd = new FormData();
    fd.append("audio", blob, "clip.wav");
    fd.append("session", cfg.session);
    fd.append("chat", "1");
    fd.append("backend", cfg.backend);
    api("/api/transcribe", { method: "POST", body: fd })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        pipelineBusy = false;
        setStatus(data.text ? "Answering…" : "Heard nothing — try again.", !data.text);
        if (handsFree) {
          if (data.text) {
            // Poll will speak the assistant event; scheduleRelisten runs when
            // audio ends (or this backup timer if speech never starts).
            awaitingReply = Date.now();
          } else {
            scheduleRelisten(300);
          }
        }
      })
      .catch(function (e) {
        pipelineBusy = false;
        setStatus(e.message, true);
        // Keep hands-free alive on a transient network error — killing the
        // whole loop is what made "mic off then on again" feel necessary.
        if (handsFree) scheduleRelisten(800);
      });
  }

  // tmux session list — for Talk to… and sendable checks only. No live pane.
  var agentSendable = false;
  var agentSessions = [];
  function loadAgents() {
    api("/api/tmux/sessions").then(function (r) { return r.json(); })
      .then(function (data) {
        agentSessions = data.sessions || [];
        applySendable();
      })
      .catch(function (e) { setStatus(e.message, true); });
  }
  function applySendable() {
    if (target.kind !== "tmux") agentSendable = true;
    else {
      var talk = agentSessions.filter(function (x) { return x.name === target.name; })[0];
      agentSendable = !!(talk && talk.sendable);
    }
    resetAgentSend();
    paintTalkForTarget();
  }

  function resetAgentSend() {
    if (typeof paintAgentMic === "function") paintAgentMic();
  }

  function agentSend() {
    if (target.kind !== "tmux" || !target.name) return;
    if (!agentSendable) {
      setStatus("That session is read-only (not in tmux-allow).", true);
      return;
    }
    var box = dictateBox();
    var text = (box && box.value.trim()) || "";
    if (!text) return;
    var sendName = target.name;
    if (box) box.value = "";
    api("/api/tmux/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: sendName, text: text, session: cfg.session })
    }).then(function () {
      addTmuxSendAck(sendName, text);
      resetAgentSend();
      setStatus("Sent to " + sendName + " — waiting for a reply on screen.");
      followPane(sendName, text);
    }).catch(function (e) {
      if (box && !(box.value || "").trim()) box.value = text;
      resetAgentSend();
      setStatus(e.message, true);
    });
  }

  // ---- dictate into the current Talk-to address --------------------------
  // Same 16 kHz WAV path as continuous mode, not MediaRecorder: a WebM/MP4
  // clip forces ffmpeg on the server before Whisper; WAV goes straight in.
  // Pause / Send is the confirm. Talk is a capability (showTalkUi), not a mode.
  var agentAudio = null;   // {stream, ctx, src, proc}
  var agentVad = null, agentRecording = false, agentPhase = "idle";  // idle|dictate|confirm
  var AG_HANG_MS = 1200, AG_MIN_MS = 300, AG_MAX_MS = 20000;
  var AG_CONFIRM_HANG_MS = 700, AG_CONFIRM_MAX_MS = 6000;

  function agentAudioStop() {
    if (!agentAudio) return;
    try { agentAudio.proc.disconnect(); agentAudio.proc.onaudioprocess = null; } catch (e) {}
    // Shared call session (phone-like duplex): do not stop tracks or close ctx.
    if (!agentAudio.shared) {
      try { agentAudio.src.disconnect(); } catch (e) {}
      try { agentAudio.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      try { agentAudio.ctx.close(); } catch (e) {}
    }
    agentAudio = null;
  }

  function agentListen(phase, onText) {
    agentPhase = phase;
    var hang = phase === "confirm" ? AG_CONFIRM_HANG_MS : AG_HANG_MS;
    var maxMs = phase === "confirm" ? AG_CONFIRM_MAX_MS : AG_MAX_MS;
    ensureCall(function (c) {
      try { if (c.ctx.resume) c.ctx.resume(); } catch (e) {}
      var rate = c.ctx.sampleRate;
      var proc = c.ctx.createScriptProcessor(CFRAME, 1, 1);
      agentAudio = { stream: c.stream, ctx: c.ctx, src: c.src, proc: proc, shared: true };
      agentVad = { speaking: false, silenceMs: 0, frames: [], total: 0, elapsed: 0 };
      agentRecording = true; paintAgentMic();

      proc.onaudioprocess = function (e) {
        if (!agentAudio) return;
        var frame = downsampleTo16k(new Float32Array(e.inputBuffer.getChannelData(0)), rate);
        var n = frame.length, sum = 0, i;
        for (i = 0; i < n; i++) sum += frame[i] * frame[i];
        var rms = Math.sqrt(sum / n), ms = (n / 16000) * 1000;
        agentVad.elapsed += ms;
        if (rms >= 0.02) {
          agentVad.speaking = true; agentVad.silenceMs = 0;
          agentVad.frames.push(frame); agentVad.total += n;
        } else if (agentVad.speaking) {
          agentVad.frames.push(frame); agentVad.total += n;
          agentVad.silenceMs += ms;
          if (agentVad.silenceMs >= hang) { agentFinish(onText); return; }
        }
        if (agentVad.elapsed >= maxMs) { agentFinish(onText); }
      };
      c.src.connect(proc);
      proc.connect(c.ctx.destination);
      setStatus(phase === "confirm" ? "Say “send” to run it, or “cancel”."
                                    : "Listening — just speak, it stops on its own.");
    }, function (e) {
      agentRecording = false; agentPhase = "idle"; paintAgentMic();
      setStatus("Microphone unavailable: " + (e && e.message || e), true);
    });
  }

  function agentFinish(onText) {
    var frames = agentVad ? agentVad.frames : [], total = agentVad ? agentVad.total : 0;
    agentAudioStop();
    agentRecording = false;
    if (!frames.length || (total / 16000) * 1000 < AG_MIN_MS) {
      agentPhase = "idle"; paintAgentMic();
      setStatus("Didn't catch that — tap Talk and speak.", true);
      return;
    }
    var merged = new Float32Array(total), off = 0;
    frames.forEach(function (f) { merged.set(f, off); off += f.length; });
    paintAgentMic();
    setStatus("Transcribing…");
    var fd = new FormData();
    fd.append("audio", encodeWav16k(merged), "clip.wav");
    fd.append("session", cfg.session);
    fd.append("chat", "0");
    api("/api/transcribe", { method: "POST", body: fd })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        agentPhase = "idle"; paintAgentMic();
        onText((data && data.text) || "");
      })
      .catch(function (e) {
        agentPhase = "idle"; paintAgentMic();
        setStatus("Dictation failed: " + e.message, true);
      });
  }

  function paintAgentMic() {
    paintTalkForTarget();
  }

  // Big Talk button: ONE design for every address — open/close channel.
  function paintTalkForTarget() {
    var b = $("talkBtn");
    if (!b) return;
    applyTalkVisibility();
    if ($("barSend")) $("barSend").disabled = (target.kind === "tmux" && !agentSendable);
    if (!showTalkUi()) return;
    if (target.kind === "tmux" && !agentSendable) {
      b.disabled = true;
      setTalkLabel("🎤", "Pick a sendable session in Talk to…");
      b.className = "";
      return;
    }
    b.disabled = false;
    if (dictateLoop) {
      if (ttsPeeking) {
        b.className = "rec";
        setTalkLabel("🔴", "Listening for you… (tap to close)");
        return;
      }
      if (ttsPlaying || resumeAfterTts) {
        b.className = "";
        setTalkLabel(ttsPlaying ? "🔊" : "⏳", ttsPlaying
          ? "Speaking — interrupt anytime (tap to close)"
          : "Waiting for reply — mic paused (tap to close)");
        return;
      }
      b.className = agentRecording === true ? "rec" : "";
      if (agentRecording === true)
        setTalkLabel("🔴", sendMode === "pause" ? "Listening… sends when you pause" : "Listening… say “over” to send");
      else
        setTalkLabel("📻", "Channel open — tap to close");
      return;
    }
    b.className = "";
    // Do not repeat the destination here — that belongs on header Talk to…
    setTalkLabel("🎤", sendMode === "pause"
      ? "Open mic (sends on pause)"
      : "Open mic (say “over” to send)");
  }

  function paintSendModeChip() {
    var c = $("modeChip");
    if (!c) return;
    if (!showTalkUi()) { c.style.display = "none"; applyTalkVisibility(); return; }
    c.style.display = "";
    if (sendMode === "pause") {
      c.textContent = "⏸";
      c.className = "chip on";
      c.title = "Send mode: pause — tap to switch to “over”";
    } else {
      c.textContent = "📻";
      c.className = "chip on";
      c.title = "Send mode: over — tap to switch to pause";
    }
    applyTalkVisibility();
  }

  function normWord(s) {
    return (s || "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  }

  // Can we dictate right now? Talking to a TERMINAL still requires a sendable
  // session — that is remote execution. Talking to an AI backend requires only
  // that sound is on, so hands-free works with no shell selected, which is now
  // the default state.
  // Sound is NOT required. The spoken confirm ("Send?" read aloud, then
  // listen) needs it, but the trailing-word form below does not — and
  // requiring sound meant no hands-free send at all in a quiet room.
  function dictateReady() {
    if (target.kind !== "tmux") return true;
    var s = agentSessions.filter(function (x) { return x.name === target.name; })[0];
    return !!(s && s.sendable);
  }

  // Channel send mode (persisted). "pause" = auto-send when silence ends the
  // utterance. "over" = radio style: buffer in the Send box until you say
  // “over”. Toggle from ⋯ More. "out" always closes; cancel always discards.
  var _TAIL_SEND = /[\s,.]*\bover\b[\s.!]*$/i;
  var _TAIL_OUT = /[\s,.]*\b(over and out|out)\b[\s.!]*$/i;
  var _TAIL_KILL = /[\s,.]*\b(cancel|scratch that|never mind|nevermind|discard)\b[\s.!]*$/i;
  var sendMode = "pause";
  try {
    var sm = localStorage.getItem("tb_send_mode");
    if (sm === "over" || sm === "pause") sendMode = sm;
  } catch (e) {}
  function setSendMode(next) {
    if (next !== "pause" && next !== "over") return;
    sendMode = next;
    try { localStorage.setItem("tb_send_mode", sendMode); } catch (e) {}
    paintTalkForTarget();
    paintSendModeChip();
    if (typeof paintAgentMic === "function") paintAgentMic();
    setStatus(sendMode === "pause"
      ? "Send mode: pause — speak; it sends when you pause. “out” closes."
      : "Send mode: over — speak, then say “over” to send. “out” closes.");
  }
  function channelOpenHint() {
    return sendMode === "pause"
      ? "speak; it sends when you pause. “out” closes."
      : "speak, then say “over” to send. “out” closes.";
  }

  function dictateBox() {
    return $("barInput");
  }

  // Hands-free means the mic is tapped ONCE, not once per transmission. While
  // this is on, sending resumes listening for the next one, the way a radio
  // returns to receive after "over".
  var dictateLoop = false;
  var ttsPlaying = false;
  var resumeAfterTts = false;
  var replyWaitTimer = null;

  function clearReplyWait() {
    if (replyWaitTimer) { clearTimeout(replyWaitTimer); replyWaitTimer = null; }
  }
  // Drop an in-flight capture WITHOUT transcribing it (it's usually the speaker).
  function hushMic() {
    if (!agentRecording && !agentAudio) return;
    agentAudioStop();
    agentRecording = false;
    agentVad = null;
    agentPhase = "idle";
    paintAgentMic();
    paintTalkForTarget();
  }
  function maybeResumeAfterTts() {
    if (!resumeAfterTts) return;
    resumeAfterTts = false;
    clearReplyWait();
    if (!dictateLoop) return;
    setStatus("Reply finished — listening.");
    setTimeout(function () {
      if (dictateLoop && !ttsPlaying) resumeDictateNow();
    }, 800);
  }

  function endDictateLoop(why) {
    dictateLoop = false;
    resumeAfterTts = false;
    clearReplyWait();
    cancelSpokenReply();
    hushMic();
    releaseCall();
    setStatus(why || "Listening stopped.");
    paintAgentMic();
    paintTalkForTarget();
  }

  function resumeDictate() {
    if (!dictateLoop || !dictateReady()) { paintAgentMic(); return; }
    // AI + Sound on: do NOT open the mic until TTS of the reply has ended.
    // Opening it early (a) records the speaker as "you" (b) iOS ducks/stops
    // playback halfway through the answer.
    if (target.kind !== "tmux" && soundOn) {
      resumeAfterTts = true;
      clearReplyWait();
      replyWaitTimer = setTimeout(function () {
        replyWaitTimer = null;
        if (!resumeAfterTts) return;
        resumeAfterTts = false;
        setStatus("No spoken reply yet — listening again.");
        resumeDictateNow();
      }, 90000);
      setStatus("Sent — mic paused until the reply is spoken.");
      paintTalkForTarget();
      return;
    }
    resumeDictateNow();
  }
  function resumeDictateNow() {
    if (!dictateLoop || !dictateReady()) { paintAgentMic(); return; }
    if (ttsPlaying) { resumeAfterTts = true; paintTalkForTarget(); return; }
    var go = function () {
      if (!dictateLoop) return;
      if (ttsPlaying) { resumeAfterTts = true; paintTalkForTarget(); return; }
      startDictate();
      paintTalkForTarget();
    };
    setTimeout(go, soundOn ? 700 : 200);
  }

  // One send path for both targets so a voice send behaves like a tapped one.
  function dispatchDictated() {
    if (target.kind === "tmux") {
      agentSend();
      // agentSend is async; keep the channel open for the next directive.
      setStatus("Sent to " + (target.name || "session") + " — listening…");
      resumeDictate();
      return;
    }
    sendTyped();
    setStatus("Sent.");
    resumeDictate();
  }

  // The button: first tap opens the channel, second tap closes it. While the
  // channel is open a tap mid-transmission just ends that transmission early.
  function agentDictate() {
    if (!dictateReady()) {
      setStatus(target.kind === "tmux"
        ? "Pick a sendable session in Talk to… (tmux-allow)."
        : "Cannot dictate right now.", true);
      return;
    }
    // Closing the channel comes FIRST. With the channel open the mic is
    // almost always recording, so testing agentRecording first meant a tap
    // only ended that transmission — and the loop immediately reopened it.
    if (dictateLoop) { endDictateLoop("Channel closed. Microphone off."); return; }
    if (agentRecording) { agentFinishNow(); return; }   // one-shot: end it early
    // Suspend Driving hands-free capture so it doesn't fight the channel mic.
    if (handsFree) {
      handsFree = false;
      awaitingReply = 0;
      if (relistenTimer) { clearTimeout(relistenTimer); relistenTimer = null; }
      if (captureRunning()) captureStop();
      else cleanupAudio();
    }
    dictateLoop = true;
    var dest = target.kind === "tmux"
      ? (target.name || "session")
      : backendLabel(target.name || cfg.backend || "AI");
    setStatus("Channel open → " + dest + " — " + channelOpenHint());
    startDictate();
  }

  function startDictate() {
    if (!dictateReady()) { dictateLoop = false; paintAgentMic(); return; }
    if (ttsPlaying) { resumeAfterTts = true; paintTalkForTarget(); return; }
    paintAgentMic();
    agentListen("dictate", function (text) {
      if (!text) {
        // Empty capture (noise only): keep the channel open, do not send.
        if (dictateLoop) { setStatus("Listening…"); resumeDictate(); }
        else setStatus("Heard nothing — try again.", true);
        return;
      }
      var box = dictateBox();
      var kill = _TAIL_KILL.test(text);
      var closing = _TAIL_OUT.test(text);
      var saidOver = _TAIL_SEND.test(text);
      // Strip protocol words; the remaining words are the payload.
      var body = text.replace(_TAIL_SEND, "").replace(_TAIL_KILL, "").replace(_TAIL_OUT, "").trim();

      if (kill) {
        if (box) box.value = "";
        if (target.kind === "tmux") resetAgentSend();
        setStatus("Cancelled — still listening.");
        resumeDictate();
        return;
      }

      // "out" / "over and out": send any payload then close the channel.
      if (closing) {
        if (box && body) {
          box.value = sendMode === "over" && box.value.trim()
            ? (box.value.trim() + " " + body)
            : body;
        }
        var had = box && box.value.trim();
        dictateLoop = false;
        if (agentRecording) agentFinishNow();
        if (had && target.kind === "tmux") {
          agentSend();
          setStatus("Sent to " + (target.name || "session") + ". Channel closed.");
        } else if (had) {
          sendTyped();
          setStatus("Sent. Channel closed.");
        } else {
          setStatus("Channel closed.");
        }
        paintAgentMic();
        paintTalkForTarget();
        return;
      }

      if (sendMode === "over") {
        // Radio style: accumulate in the Send box until trailing “over”.
        if (box && body) box.value = (box.value ? box.value.trim() + " " : "") + body;
        if (target.kind === "tmux") resetAgentSend();
        if (saidOver) {
          if (!box || !box.value.trim()) {
            setStatus("Nothing to send — still listening.");
            resumeDictate();
            return;
          }
          dispatchDictated();
          return;
        }
        setStatus((target.kind === "tmux" ? ("→ " + (target.name || "shell") + ": ") : "") +
                  "…end with “over” to send, or keep talking.");
        if (dictateLoop) resumeDictate();
        return;
      }

      // pause mode: each finished utterance is one send.
      if (!body) {
        setStatus("Nothing to send — still listening.");
        resumeDictate();
        return;
      }
      if (box) box.value = body;
      if (target.kind === "tmux") resetAgentSend();
      dispatchDictated();
    });
  }

  function agentFinishNow() {
    if (agentAudio && agentVad) { agentVad.silenceMs = 1e9; }   // next frame flushes
  }

  // ---- Target: the one thing your words go to -----------------------------
  // A model or a shell is an address, not a different screen. Selecting one
  // never rearranges the layout.
  var target = { kind: "ai", name: "" };   // kind: ai | tmux  (transport only)

  function targetLabel() {
    if (target.kind === "tmux") return target.name;
    return backendLabel(target.name || cfg.backend || "AI");
  }

  function paintTargetChip() {
    var b = $("targetBtn");
    if (!b) return;
    // Target label stays visible on narrow screens; only the "Talk to:" drops.
    b.textContent = "";
    var lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "Talk to: ";
    b.appendChild(lbl); b.appendChild(document.createTextNode(targetLabel()));
    b.title = "Tap to pick who you talk to";
  }

  function setTarget(kind, name) {
    if (dictateLoop) endDictateLoop("Target changed — channel closed.");
    stopPaneWatch();
    target = { kind: kind, name: name || "" };
    if (kind === "ai") {
      cfg.backend = name || "";
      try { localStorage.setItem("tb_backend", cfg.backend); } catch (e) {}
      if ($("backendSel")) $("backendSel").value = cfg.backend;
      agentSendable = true;
    } else {
      var s = agentSessions.filter(function (x) { return x.name === name; })[0];
      agentSendable = !!(s && s.sendable);
      if (!agentSessions.length) loadAgents();
      else applySendable();
    }
    if ($("barInput")) $("barInput").value = "";
    renderTranscript();
    paintTargetChip();
    paintTalkForTarget();
    var known = (kind === "tmux" && name)
      ? agentSessions.filter(function (x) { return x.name === name; })[0]
      : null;
    var hint;
    if (known && !known.sendable) hint = "read-only (not in tmux-allow).";
    else if (showTalkUi()) hint = channelOpenHint();
    else hint = "type and Send.";
    setStatus("Talk to " + targetLabel() + " — " + hint);
  }

  function openTargetSheet() {
    var rows = [];
    if (!(window.__backends || []).length) {
      rows.push({
        label: "Models appear once the bridge connects",
        note: "Shells below still work if the host is up",
        onClick: function () {}
      });
    }
    (window.__backends || []).forEach(function (b) {
      var here = target.kind === "ai" && cfg.backend === b;
      rows.push({
        label: (here ? "● " : "○ ") + backendLabel(b),
        note: b ? "model" : "server default",
        onClick: function () { setTarget("ai", b); }
      });
    });
    api("/api/tmux/sessions").then(function (r) { return r.json(); })
      .then(function (d) {
        agentSessions = d.sessions || [];
        agentSessions.forEach(function (sn) {
          var here = target.kind === "tmux" && target.name === sn.name;
          rows.push({
            label: (here ? "● " : "○ ") + sn.name + (sn.attached ? " •" : ""),
            note: sn.sendable ? "shell · can type" : "shell · read-only",
            onClick: function () { setTarget("tmux", sn.name); }
          });
        });
        openSheet("Talk to…", rows);
      })
      .catch(function () { openSheet("Talk to…", rows); });
  }

  // ---- the one sheet ------------------------------------------------------
  // openSheet(title, rows) where each row is {label, note, onClick} — or
  // {html} for a custom body. Everything that used to be its own overlay
  // renders through here.
  function openSheet(title, rows) {
    $("sheetTitle").textContent = title;
    var body = $("sheetBody");
    body.innerHTML = "";
    rows.forEach(function (r) {
      if (r.html) {
        var d = document.createElement("div");
        d.innerHTML = r.html;
        body.appendChild(d);
        return;
      }
      var b = document.createElement("button");
      b.className = "row";
      b.textContent = r.label;
      b.onclick = function () { closeSheet(); r.onClick(); };
      body.appendChild(b);
      if (r.note) {
        var n = document.createElement("div");
        n.className = "row-note";
        n.textContent = r.note;
        body.appendChild(n);
      }
    });
    $("sheet").style.display = "block";
  }
  function closeSheet() { $("sheet").style.display = "none"; }
  $("sheetClose").onclick = closeSheet;
  $("sheet").addEventListener("click", function (e) {
    if (e.target === $("sheet")) closeSheet();   // tap the scrim to dismiss
  });

  if ($("targetBtn")) $("targetBtn").onclick = openTargetSheet;

  function barTypeSend() {
    sendTyped();
  }
  if ($("barSend")) {
    $("barSend").onclick = barTypeSend;
    $("barInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") barTypeSend();
    });
  }

  $("overflowBtn").onclick = function () {
    var rows = [
      { label: "📁 Library — transcripts on the workstation",
        note: "Browse, save to a project, label speakers",
        onClick: openTranscripts },
      { label: "🧹 Clear conversation",
        note: "Clears this screen only; saved transcripts are untouched",
        onClick: clearConversation },
      { label: "⚙ Settings",
        note: "Bridge URL, token, session name",
        onClick: function () { openSettings(true); } }
    ];
    rows.splice(1, 0, { label: "🎯 Talk to…",
      note: "Pick a model or a workstation shell",
      onClick: openTargetSheet });
    if (showTalkUi()) {
      rows.splice(2, 0, sendMode === "pause"
        ? { label: "📻 Switch to “over” to send",
            note: "Same as tapping the ⏸ chip — buffer until you say “over”",
            onClick: function () { setSendMode("over"); } }
        : { label: "⏸ Switch to send on pause",
            note: "Same as tapping the 📻 chip — each pause sends",
            onClick: function () { setSendMode("pause"); } });
      rows.splice(3, 0, continuousMode
        ? { label: "📻 Back to channel mic",
            note: "Leave silent continuous; return to Talk channel",
            onClick: function () { if (window.__setMicMode) window.__setMicMode("tap"); } }
        : { label: "🎙 Continuous transcription (rare)",
            note: "Silent always-on notes — Meeting-style. Prefer the Listen tab for meetings.",
            onClick: function () { if (window.__setMicMode) window.__setMicMode("continuous"); } });
    }
    openSheet("More", rows);
  };

  // Clear the conversation with the CURRENT target (screen + this browser's
  // cached history for it). Other targets keep theirs. Saved transcripts on
  // the workstation are untouched, and polling continues from the current
  // event cursor so cleared messages don't come back.
  function clearConversation() {
    var key = currentTargetKey();
    history = history.filter(function (h) { return !histMatches(h, key); });
    saveHistory();
    $("transcript").innerHTML = "";
    contTranscript = [];        // analyses start fresh from here too
    setInterim("");
    setStatus("Cleared.");
  };

  // ---- settings ----
  function openSettings(show) {
    $("settings").style.display = show ? "block" : "none";
    $("cfgBridge").value = cfg.bridge;
    $("cfgToken").value = cfg.token;
    $("cfgSession").value = cfg.session;
  }
  // Normalize a pasted Bridge URL. Phones "help" in ways .trim() can't undo:
  // Smart Punctuation swaps hyphens for en/em-dashes and copy/paste drags in
  // zero-width chars — either makes fetch throw an opaque "did not match the
  // expected pattern" error. Fix the common ones and require a sane https URL.
  function cleanBridge(raw) {
    var v = (raw || "")
      .replace(/[\u2010-\u2015\u2212]/g, "-")     // en/em/figure dash, minus -> hyphen
      .replace(/[\u200B-\u200D\uFEFF]/g, "")      // zero-width space / BOM
      .replace(/\s+/g, "")                        // any leftover whitespace
      .replace(/\/+$/, "");                       // trailing slash(es)
    if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
    return v;
  }
  function bridgeLooksValid(v) {
    return /^https:\/\/[\w.-]+\.[\w.-]+/.test(v);
  }
  $("saveBtn").onclick = function () {
    var b = cleanBridge($("cfgBridge").value);
    if (b && !bridgeLooksValid(b)) {
      setStatus("That Bridge URL looks malformed — check for stray characters " +
        "or dashes changed to “–”. It should be like https://name.tailnet.ts.net", true);
      $("cfgBridge").value = b;   // show the cleaned value so the problem is visible
      return;
    }
    cfg.bridge = b;
    $("cfgBridge").value = b;
    cfg.token = $("cfgToken").value.trim();
    cfg.session = $("cfgSession").value.trim() || "car";
    try {
      localStorage.setItem("tb_bridge", cfg.bridge);
      localStorage.setItem("tb_token", cfg.token);
      localStorage.setItem("tb_session", cfg.session);
    } catch (e) {}
    openSettings(false);
    setStatus("Saved.");
    firstPoll = true; lastEventId = 0;
    // History is per session: reload the cache for the saved one and repaint.
    histKey = "tb_history:" + cfg.session;
    try { history = JSON.parse(localStorage.getItem(histKey) || "[]") || []; } catch (e2) { history = []; }
    if (!Array.isArray(history)) history = [];
    renderTranscript();
    // Boot skips the session survey when there is no bridge yet, so on a
    // first-time setup this is the first moment the host can be asked. Without
    // it the shell list in Talk to… stays empty.
    loadAgents();
  };
  if ($("settingsClose")) $("settingsClose").onclick = function () { openSettings(false); };
  $("testBtn").onclick = function () {
    cfg.bridge = cleanBridge($("cfgBridge").value);
    $("cfgBridge").value = cfg.bridge;
    if (!bridgeLooksValid(cfg.bridge)) {
      setStatus("That Bridge URL looks malformed — check for stray characters " +
        "or dashes changed to “–”. It should be like https://name.tailnet.ts.net", true);
      setConn(false);
      return;
    }
    fetch(cfg.bridge + "/api/ping").then(function (r) { return r.json(); })
      .then(function (d) { setStatus("Bridge reachable — backend: " + d.backend); setConn(true); })
      .catch(function (e) { setStatus("Cannot reach bridge: " + e.message, true); setConn(false); });
  };

  // ---- sound toggle (also the audio-unlock tap for autoplay policy) ----
  // Sound OFF must mean silent NOW (meetings): cut the reply currently
  // playing and cancel the browser-voice fallback, not just future ones.
  $("soundBtn").onclick = function () {
    soundOn = !soundOn;
    setBtnLabel("soundBtn", soundOn ? "🔊" : "🔇", soundOn ? " Sound on" : " Sound off");
    if (typeof paintAgentMic === "function") paintAgentMic();   // dictation is sound-gated
    if (soundOn) { unlockAudio(); }      // unlock <audio> inside this tap gesture
    else {
      try { audioEl.pause(); audioEl.removeAttribute("src"); audioEl.load(); } catch (e) {}
      if ("speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch (e) {} }
      awaitingReply = 0;
      // hands-free needs to hear replies to know when to listen again
      if (handsFree && window.__setMicMode) window.__setMicMode("tap");
    }
  };

  // ---- wire up (one Send box: #barInput / #barSend) ----

  // ---- workstation transcript browser (📁) — the files live on the Ubuntu
  //      box (~/.config/tesla-bridge/transcripts), never on this device ----
  function showTranscriptList() {
    $("transcriptsBack").style.display = "none";
    $("transcriptView").style.display = "none";
    var list = $("transcriptsList");
    list.style.display = "block";
    list.textContent = "Loading…";
    api("/api/transcripts").then(function (r) { return r.json(); })
      .then(function (data) {
        list.textContent = "";
        var items = (data.transcripts || []);
        if (!items.length) { list.textContent = "No transcripts saved yet."; return; }
        items.forEach(function (t) {
          var b = document.createElement("button");
          b.className = "secondary";
          b.style.cssText = "display:block; width:100%; text-align:left; margin:0 0 8px;";
          b.textContent = "📄 " + t.session + " — " + t.date +
            "  (" + Math.max(1, Math.round((t.bytes || 0) / 1024)) + " KB)";
          b.onclick = function () { showTranscriptFile(t.session, t.date); };
          list.appendChild(b);
        });
      })
      .catch(function (e) { list.textContent = "Load failed: " + e.message; });
  }
  function showTranscriptFile(session, date) {
    $("transcriptsList").style.display = "none";
    $("transcriptsBack").style.display = "inline-block";
    var v = $("transcriptView");
    v.style.display = "block";
    v.textContent = "Loading…";
    api("/api/transcript?session=" + encodeURIComponent(session) +
        "&date=" + encodeURIComponent(date))
      .then(function (r) { return r.json(); })
      .then(function (data) { v.textContent = data.text || "(empty)"; })
      .catch(function (e) { v.textContent = "Load failed: " + e.message; });
  }
  function openTranscripts() {
    $("transcriptsPane").style.display = "block";
    showTranscriptList();
    // fill the save-to-project picker once per page load
    var sel = $("exportDest");
    if (!sel.options.length) {
      api("/api/export/dests").then(function (r) { return r.json(); })
        .then(function (d) {
          (d.dests || []).forEach(function (name) {
            var o = document.createElement("option");
            o.value = name; o.textContent = name;
            sel.appendChild(o);
          });
        }).catch(function () { /* pane still works read-only */ });
    }
  }
  // Speaker diarization: the workstation embeds each saved utterance and
  // clusters the voices, so attribution is corrected from the audio instead
  // of relying on the live 🗣/📻 toggle. Result is a separate transcript
  // (<session>-diarized-<date>) — originals are untouched.
  $("diarizeBtn").addEventListener("click", function () {
    var st = $("exportStatus");
    st.style.display = "block"; st.style.color = "#8fd19e";
    st.textContent = "Labelling speakers on the workstation… (a minute or two)";
    api("/api/diarize", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: cfg.session })
    }).then(function (r) { return r.json().then(function (d) { return r.ok ? d : Promise.reject(new Error(d.detail || r.status)); }); })
      .then(function (d) {
        if (d.running) { st.textContent = "Already running — try again shortly."; return; }
        st.textContent = "Labelled " + d.labelled + " utterances, " +
          d.speakers + " speaker(s). Open the " + cfg.session + "-diarized file below.";
        showTranscriptList();
      })
      .catch(function (e) { st.style.color = "#ffb4a8"; st.textContent = "Diarize failed: " + e.message; });
  });

  $("exportBtn").addEventListener("click", function () {
    var st = $("exportStatus");
    st.style.display = "block"; st.style.color = "#8fd19e";
    st.textContent = "Saving…";
    api("/api/export", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: cfg.session,
        dest: $("exportDest").value,
        label: $("exportLabel").value,
        scope: "last"
      })
    }).then(function (r) { return r.json().then(function (d) { return r.ok ? d : Promise.reject(new Error(d.detail || r.status)); }); })
      .then(function (d) { st.textContent = "Saved on the workstation: " + d.path; })
      .catch(function (e) { st.style.color = "#ffb4a8"; st.textContent = "Save failed: " + e.message; });
  });
  $("transcriptsBack").addEventListener("click", showTranscriptList);
  $("transcriptsClose").addEventListener("click", function () {
    $("transcriptsPane").style.display = "none";
  });


  // Mic UI is set up once; Talk opens the channel in the same gesture
  // (browsers require a tap for getUserMedia).
  var micUiReady = false;
  function ensureMicUi() {
    if (micUiReady) return micSupported();
    micUiReady = true;
    $("speakerToggle").style.display = "none";
    $("analyzeBtn").style.display = "none";
    document.body.classList.remove("continuous");
    if (!micSupported()) {
      applyTalkVisibility();
      return false;
    }
    micMode = "tap";
    handsFree = false;
    continuousMode = false;
    paintSendModeChip();
    $("modeChip").addEventListener("click", function () {
      setSendMode(sendMode === "pause" ? "over" : "pause");
    });
    function setMicMode(next) {
      if (next === "continuous") {
        if (dictateLoop) endDictateLoop("Channel closed — starting continuous.");
        micMode = "continuous";
        continuousMode = true;
        handsFree = false;
        startContinuous();
        $("speakerToggle").style.display = "";
        $("analyzeBtn").style.display = "";
        document.body.classList.add("continuous");
        setStatus("🎙 Continuous — silent transcription. Tap 🎤 to stop / return to channel.");
        syncWakeLock();
        syncRefineTimer();
        applyTalkVisibility();
        return;
      }
      if (micMode === "continuous") { stopContinuous(); setInterim(""); }
      micMode = "tap";
      continuousMode = false;
      handsFree = false;
      $("speakerToggle").style.display = "none";
      $("analyzeBtn").style.display = "none";
      document.body.classList.remove("continuous");
      syncWakeLock();
      syncRefineTimer();
      paintTalkForTarget();
      paintSendModeChip();
    }
    window.__setMicMode = setMicMode;
    window.__setTargetForTest = setTarget;   // test hook, same pattern as __setMicMode
    $("talkBtn").addEventListener("click", function () {
      ensureSound();   // user gesture — iOS will not unlock audio on page load
      if (micMode === "continuous") {
        setMicMode("tap");
        return;
      }
      agentDictate();
      paintTalkForTarget();
    });
    $("analyzeBtn").addEventListener("click", analyzeTranscript);
    $("speakerToggle").addEventListener("click", function () {
      contSpeaker = contSpeaker === "me" ? "source" : "me";
      paintSpeakerToggle();
    });
    paintSpeakerToggle();
    return true;
  }

  applyTalkVisibility();
  if (showTalkUi()) {
    ensureMicUi();
    paintTalkForTarget();
    paintSendModeChip();
    setStatus("Tap 🎤 in the top bar to open the channel, then speak. Pause sends.");
  } else {
    setStatus("Type a message, then Send.");
  }

  // ---- keep the bottom row (Send) inside the visible frame -----------------
  // Three cases that used to strand Send off-screen:
  //  1. Maat iframe: height:100dvh / visualViewport alone measure the *phone*,
  //     not the iframe above Maat's tab bar → the bar sits under the tabs.
  //  2. iOS keyboard: layout viewport stays tall; visual viewport shrinks →
  //     the bar sits behind the keyboard (and Maat's overflow:hidden blocks
  //     scrolling to it).
  //  3. long chat: flex:1 without min-height:0 grows past the frame (fixed in CSS).
  //
  // Always size to min(innerHeight, visualViewport.height). In an iframe
  // innerHeight is the frame; when the keyboard opens visualViewport is
  // smaller. Never use bare 100dvh.
  var embedded = false;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  if (!embedded) {
    try { document.documentElement.classList.add("top-level"); } catch (e) {}
  }

  function fitLayoutHeight() {
    var h = window.innerHeight || 0;
    // Maat iframe: innerHeight/visualViewport can be the *phone*, so the bar
    // paints under the shell's tab bar and taps hit the tabs (looks dead).
    try {
      if (window.frameElement && window.frameElement.clientHeight > 0)
        h = window.frameElement.clientHeight;
    } catch (e) {}
    var vv = window.visualViewport;
    if (vv && vv.height > 0) h = Math.min(h, vv.height);
    if (h < 1) return;
    document.documentElement.style.height = h + "px";
    document.body.style.height = h + "px";
  }
  fitLayoutHeight();
  window.addEventListener("resize", fitLayoutHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitLayoutHeight);
    // iOS shifts the visual viewport when a focused field is revealed.
    window.visualViewport.addEventListener("scroll", fitLayoutHeight);
  }

  if (!cfg.bridge || !cfg.token) {
    openSettings(true);
    setStatus("First-time setup: enter the Bridge URL and token.", true);
  } else {
    setStatus("Connecting…");
    // Survey shells so Talk to… knows sendable vs read-only.
    loadAgents();
  }
  paintTargetChip();
  renderTranscript();   // cached history for the starting target
  poll();
  setInterval(poll, 2500);
})();
</script>
</body>
</html>
