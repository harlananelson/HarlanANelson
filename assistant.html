<title>Home AI</title>
<style>
  /* Tesla console: Chromium ~109, touch only, viewed at arm's length.
     Big targets, big type, dark theme, zero external assets. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Fill the *frame*, not the phone's full visual viewport. When this page is
     loaded alone, that is the screen. When Maat embeds it in an iframe above
     a tab bar, 100dvh is taller than the iframe and the Send row is clipped
     under the shell's tabs — the bug that made Send unreachable on a phone. */
  html { height: 100%; }
  body {
    background: #111; color: #eee;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 20px; display: flex; flex-direction: column;
    /* Nothing may scroll the page itself: the bottom row is pinned by layout,
       and a page that can scroll can strand it above the fold instead. */
    overflow: hidden;
    height: 100%;
    max-height: 100%;
    /* JS fitLayoutHeight() sets an explicit px height for keyboard / embed. */
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: #1b1b1b; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; font-weight: 600; flex: 1 1 auto; min-width: 4rem; }
  header .hdr-actions {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-left: auto; justify-content: flex-end;
  }
  /* Header actions scale with the viewport: --hdr-icon is the icon size,
     clamped so a phone never drops below a thumb target and a wall console
     never balloons. Padding/gaps derive from it. */
  header { --hdr-icon: clamp(18px, 2.6vw, 30px); }
  header .hdr-actions button {
    font-size: calc(var(--hdr-icon) * 0.8); padding: calc(var(--hdr-icon) * 0.45) calc(var(--hdr-icon) * 0.6);
    white-space: nowrap; line-height: 1.2;
  }
  /* Narrow screens (phone): the header must stay one row, so the text half
     of each action drops and the icon carries it. .lbl is the droppable part. */
  @media (max-width: 640px) {
    header { gap: 6px; padding: 8px 10px; }
    header h1 { font-size: 16px; }
    header .hdr-actions { gap: 6px; flex-wrap: nowrap; }
    header .hdr-actions .lbl { display: none; }
  }
  /* Target must stay visible — this is how you pick Claude/gemma/tmux. */
  #targetBtn { background: #2b6cb0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #666; display: inline-block; }
  .dot.ok { background: #2ecc71; }
  .dot.bad { background: #e74c3c; }
  button {
    background: #2b6cb0; color: #fff; border: 0; border-radius: 12px;
    font-size: 20px; padding: 14px 22px; cursor: pointer; touch-action: manipulation;
  }
  button.secondary { background: #333; }
  button:disabled { opacity: .45; }
  #status { padding: 6px 18px; font-size: 16px; color: #999; min-height: 28px; }
  #status.err { color: #ff8b7d; }
  /* min-height:0 is load-bearing, not tidiness. A column flex item defaults to
     min-height:auto, so a long conversation makes this refuse to shrink and
     pushes the bar — and its Send button — off the bottom of the screen. */
  #transcript {
    flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; display: flex;
    flex-direction: column; gap: 12px;
  }
  .msg { max-width: 82%; padding: 14px 18px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2b6cb0; }
  .msg.assistant { align-self: flex-start; background: #262626; }
  .msg.error { align-self: center; background: #4a1f1c; color: #ffb4a8; font-size: 17px; }
  .msg .tag { display: block; font-size: 13px; color: #7fb3e8; margin-bottom: 4px; }
  #backendSel { display: none !important; }
  select {
    font-size: 19px; padding: 12px; border-radius: 12px;
    border: 1px solid #444; background: #222; color: #eee;
  }
  #views-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .msg.user .tag { color: #9cc4e0; }
  .msg.tmux-send { align-self: flex-end; background: #1a3a2a; border: 1px solid #2d6a4f; }
  /* One instrument for every address (AI or shell). Talk hides when there is
     no usable mic; type + Send always remain. */
  #bar {
    display: flex; flex-direction: column; gap: 8px; background: #1b1b1b;
    flex: 0 0 auto;
    padding: 8px 12px 10px;
  }
  html.top-level #bar {
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  #barContext { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #barType { display: flex; flex-wrap: nowrap; gap: 8px; align-items: stretch; }
  #barType input {
    flex: 1 1 auto; min-width: 0; font-size: 16px; padding: 10px 12px;
    border-radius: 12px; border: 1px solid #444; background: #222; color: #eee;
  }
  #barSend { flex: 0 0 auto; min-width: 44px; padding: 10px 14px; font-size: 20px; line-height: 1; }
  .chip {
    background: #333; font-size: 16px; padding: 8px 14px; border-radius: 999px;
  }
  .chip.on { background: #2b6cb0; }
  /* Mic + pause live in the header (2026-09-04): one row of compact icon
     buttons. The long state text moved to title/aria-label + #status. */
  #talkBtn {
    min-width: 44px; min-height: 44px; font-size: var(--hdr-icon);
    padding: calc(var(--hdr-icon) * 0.4) calc(var(--hdr-icon) * 0.55);
    border-radius: 12px; line-height: 1;
    background: #2b6cb0; user-select: none; -webkit-user-select: none;
  }
  #talkBtn.rec { background: #c0392b; }
  header #modeChip {
    min-height: 44px; font-size: calc(var(--hdr-icon) * 0.9);
    padding: calc(var(--hdr-icon) * 0.4) calc(var(--hdr-icon) * 0.55); line-height: 1;
  }
  /* Continuous mode: the transcript is the point — give it the screen, drop the
     big talk button, and compact the controls into a bar under it. */
  body.continuous #talkBtn { background: #c0392b; }
  /* live interim line (speech being captured / transcribed) */
  .msg.interim { align-self: flex-start; background: #23303a; color: #9cc4e0;
    font-style: italic; opacity: .9; }
  /* Settings is an overlay — in-flow it stole the transcript and pushed
     Talk/Send under the Maat tab bar (taps hit the tabs: "non-responsive"). */
  #settings {
    display: none; position: fixed; inset: 0; z-index: 25;
    padding: 18px; background: #1b1b1b; overflow-y: auto;
  }
  #settings label { display: block; font-size: 16px; color: #aaa; margin: 12px 0 4px; }
  #settings input { width: 100%; font-size: 19px; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #eee; }
  #settings .row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .hint { font-size: 15px; color: #888; margin-top: 10px; line-height: 1.4; }
  /* Console pass: the car screen is the SAME layout scaled up (principle 6),
     not a different design. Coarse pointer + wide viewport ⇒ arm's length. */
  @media (pointer: coarse) and (min-width: 1100px) {
    body { font-size: 24px; }
    button { font-size: 24px; padding: 18px 26px; }
    header { --hdr-icon: clamp(28px, 2.6vw, 40px); }
    #talkBtn, header #modeChip { min-height: 64px; min-width: 64px; }
    .chip { font-size: 20px; padding: 10px 18px; }
    .sheet-body button.row { font-size: 22px; }
  }
  .msg.notice { align-self: center; background: #23303a; color: #9cc4e0; font-size: 16px; }
  /* One reusable sheet — every overlay in the app is this, not a bespoke
     inline-styled pane (see documents/assistant-design-philosophy.md). */
  .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); padding: 20px; }
  .sheet-card {
    max-width: 640px; margin: 0 auto; max-height: 100%; display: flex;
    flex-direction: column; background: #161b22; border: 1px solid #30363d;
    border-radius: 12px; overflow: hidden;
  }
  .sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #30363d; }
  .sheet-body { overflow-y: auto; padding: 12px 14px; }
  .sheet-body button.row {
    display: block; width: 100%; text-align: left; margin: 0 0 10px;
    background: #333; font-size: 19px;
  }
  .sheet-body .row-note { font-size: 14px; color: #8b949e; margin: -4px 0 12px 4px; }
</style>
</head>
<body>
<header>
  <h1>Home AI <span id="connDot" class="dot"></span></h1>
  <div class="hdr-actions">
    <!-- Mic controls: send-mode chip + open-mic. Both hide when this browser
         has no mic (applyTalkVisibility). -->
    <button id="modeChip" class="chip" title="Send mode">⏸</button>
    <button id="talkBtn" title="Tap to talk" aria-label="Tap to talk">🎤</button>
    <button id="soundBtn" class="secondary">🔇<span class="lbl"> Sound</span></button>
    <!-- Who you're talking to — always visible next to Sound. Same picker
         for models and shells; address never changes this layout. -->
    <button id="targetBtn" title="Pick who you talk to">Talk to…</button>
    <button id="overflowBtn" class="secondary" title="Library, clear, settings">⋯<span class="lbl"> More</span></button>
  </div>
</header>

<!-- One sheet for set-and-forget actions. Principle: chrome earns its place by
     frequency × urgency; anything you don't need mid-conversation lives here. -->
<div id="sheet" class="sheet" style="display:none">
  <div class="sheet-card">
    <div class="sheet-head">
      <strong id="sheetTitle" style="flex:1">More</strong>
      <button id="sheetClose" class="secondary" style="margin:0">Close</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>
<div id="transcriptsPane" style="display:none; position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.55); padding:20px;">
  <div style="max-width:640px; margin:0 auto; max-height:100%; display:flex; flex-direction:column; background:#161b22; border:1px solid #30363d; border-radius:12px; overflow:hidden;">
    <div style="display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid #30363d;">
      <strong style="flex:1">📁 Transcripts on the workstation</strong>
      <button id="transcriptsBack" class="secondary" style="margin:0; display:none">← List</button>
      <button id="transcriptsClose" class="secondary" style="margin:0">Close</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid #30363d; flex-wrap:wrap;">
      <span style="font-size:15px; color:#aaa;">💾 Save last meeting to</span>
      <select id="exportDest" style="font-size:16px; padding:8px;"></select>
      <input id="exportLabel" placeholder="label (e.g. insurance-call)" autocomplete="off"
             style="flex:1; min-width:120px; font-size:16px; padding:8px 10px; border-radius:8px; border:1px solid #444; background:#222; color:#eee;">
      <button id="exportBtn" class="secondary" style="margin:0">Save</button>
      <button id="diarizeBtn" class="secondary" style="margin:0" title="Label who spoke, from the audio">🗣 Who spoke</button>
    </div>
    <div id="exportStatus" style="display:none; padding:6px 14px; font-size:14px; color:#8fd19e;"></div>
    <div id="transcriptsList" style="overflow-y:auto; padding:12px 14px;"></div>
    <div id="transcriptView" style="display:none; overflow-y:auto; padding:12px 14px; white-space:pre-wrap; font-size:14px; line-height:1.5;"></div>
  </div>
</div>

<div id="status">Loading…</div>

<div id="settings">
  <label>Bridge URL (Tailscale Funnel address, https://…)</label>
  <input id="cfgBridge" placeholder="https://your-machine.your-tailnet.ts.net" autocapitalize="off">
  <label>Token</label>
  <input id="cfgToken" placeholder="bearer token from bin/setup-token" autocapitalize="off">
  <label>Session (same word on car and phone)</label>
  <input id="cfgSession" value="car" autocapitalize="off">
  <div class="row">
    <button id="saveBtn">Save</button>
    <button id="testBtn" class="secondary">Test connection</button>
    <button id="settingsClose" class="secondary" type="button">Close</button>
  </div>
  <p class="hint">Tip: you can pre-fill this by opening the page as
    …/assistant.html?bridge=URL&amp;token=TOKEN — handy the first time,
    since typing on the console is slow. Settings persist in this browser.</p>
</div>

<div id="views-wrap">
  <div id="transcript"></div>
</div>

<!-- One bar for every address. Mic + pause moved to the header; this row is
     type + Send, with the meeting-mode chips above it when they apply. -->
<div id="bar">
  <div id="barContext">
    <button id="speakerToggle" class="chip" style="display:none">🗣 me</button>
    <button id="analyzeBtn" class="chip" style="display:none">🧠 Analyze</button>
  </div>
  <div id="barType">
    <input id="barInput" placeholder="Type a message" autocomplete="off">
    <button id="barSend" title="Send" aria-label="Send">➤</button>
  </div>
</div>
<select id="backendSel" title="AI backend" aria-hidden="true" hidden></select>

<script>
"use strict";
/* Written for the Tesla in-car browser: Chromium ~109 feature level, no dev
   console (all errors go to the on-page status line). Talk hides when this
   browser cannot capture (showTalkUi); type+Send always remain. Audio
   playback must be unlocked by a user tap. Transport is fetch polling. */
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // ---- config (URL params override, then persist in localStorage) ----
  var params = new URLSearchParams(location.search);
  function cfgGet(k, dflt) {
    var v = params.get(k);
    if (v) { try { localStorage.setItem("tb_" + k, v); } catch (e) {} return v; }
    try { return localStorage.getItem("tb_" + k) || dflt; } catch (e) { return dflt; }
  }
  // mode=mic / input=mic: Maat Converse hint that this device should offer Talk
  // if the browser can capture. Not a second layout.
  var inputParam = (params.get("input") || "").toLowerCase();
  var modeParam = (params.get("mode") || "").toLowerCase();
  if (!modeParam && inputParam === "mic") modeParam = "mic";
  var cfg = {
    bridge: (cfgGet("bridge", "") || "").replace(/\/+$/, ""),
    token: cfgGet("token", ""),
    session: cfgGet("session", "car") || "car",
    backend: cfgGet("backend", "") || "",   // "" = server default
    mode: modeParam === "mic" ? "mic" : ""   // URL compat; Talk visibility is showTalkUi()
  };
  // ?token= is saved to localStorage above — scrub it from the visible URL
  // and browser history (keep the other params, e.g. mode=mic).
  if (params.has("token") && window.history && history.replaceState) {
    params.delete("token");
    var q = params.toString();
    try { history.replaceState(null, "", location.pathname + (q ? "?" + q : "")); } catch (e) {}
  }
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.type !== "maat-auth" || !d.token) return;
    cfg.token = String(d.token);
    try { localStorage.setItem("tb_token", cfg.token); } catch (e) {}
    if (d.bridge) {
      cfg.bridge = String(d.bridge).replace(/\/+$/, "");
      try { localStorage.setItem("tb_bridge", cfg.bridge); } catch (e2) {}
    }
    if ($("cfgToken")) $("cfgToken").value = cfg.token;
  });
  try { window.parent.postMessage({ type: "maat-auth-please" }, "*"); } catch (e) {}
  if (cfg.token) {
    try {
      window.parent.postMessage({ type: "maat-auth-offer", token: cfg.token, bridge: cfg.bridge || "" }, "*");
    } catch (e) {}
  }

  var soundOn = false;
  var lastEventId = 0;
  var lastSpokenId = 0;   // don't re-speak history on page load
  var firstPoll = true;
  var audioEl = new Audio();
  // iOS/iPadOS: without playsInline, <audio> can refuse to play (or go
  // full-screen and stall), so TTS replies never finish and the voice loop
  // never re-opens the mic.
  try {
    audioEl.setAttribute("playsinline", "true");
    audioEl.setAttribute("webkit-playsinline", "true");
    audioEl.playsInline = true;
    audioEl.preload = "auto";
  } catch (e) {}

  // Hands-free conversation: talk↔listen loops on its own (Driving situation).
  var handsFree = false;      // whether the loop is active
  var awaitingReply = 0;      // timestamp we expect a spoken reply before re-listening
  var pipelineBusy = false;   // true while transcribe/chat is in flight (not idle)
  // Continuous transcription: always-on listening, VAD-segmented, never speaks —
  // the transcript just keeps filling as you talk (like the translator app).
  var continuousMode = false;
  var micMode = "tap";   // tap | handsfree | continuous (see setMicMode)
  // Resume listening after a spoken reply (or if speech never started).
  // Debounced so ended + error + timeout cannot start two captures.
  var relistenTimer = null;
  function scheduleRelisten(delayMs) {
    awaitingReply = 0;
    if (relistenTimer) { clearTimeout(relistenTimer); relistenTimer = null; }
    if (!handsFree) return;
    relistenTimer = setTimeout(function () {
      relistenTimer = null;
      relisten();
    }, delayMs == null ? 200 : delayMs);
  }
  audioEl.addEventListener("ended", function () { scheduleRelisten(250); });
  audioEl.addEventListener("error", function () { scheduleRelisten(250); });

  function setStatus(text, isErr) {
    var s = $("status");
    s.textContent = text || "";
    s.className = isErr ? "err" : "";
  }
  function setConn(ok) { $("connDot").className = "dot " + (ok ? "ok" : "bad"); }

  // Ship browser-side errors to the bridge so they're visible on the
  // workstation (client-errors.log) — the car/phone have no dev console.
  function reportError(source, message) {
    try {
      if (!cfg.bridge || !cfg.token) return;
      fetch(cfg.bridge + "/api/clientlog", {
        method: "POST",
        headers: { "Authorization": "Bearer " + cfg.token, "Content-Type": "application/json" },
        body: JSON.stringify({ source: source, message: String(message).slice(0, 900), ua: navigator.userAgent })
      }).catch(function () {});
    } catch (e) {}
  }
  window.addEventListener("error", function (e) {
    reportError("assistant", (e.message || "error") + " @ " + (e.filename || "") + ":" + (e.lineno || 0));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason; reportError("assistant", "unhandledrejection: " + ((r && r.message) || r || ""));
  });

  function api(path, opts) {
    opts = opts || {};
    if (!cfg.bridge) return Promise.reject(new Error("No Bridge URL set — open Settings"));
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + cfg.token;
    return fetch(cfg.bridge + path, opts).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          throw new Error("HTTP " + r.status + " " + t.slice(0, 200));
        });
      }
      return r;
    });
  }

  // ---- transcript rendering ----
  // ---- per-target history (2026-09-04) ----
  // Every message is kept in memory (and localStorage, per session) tagged
  // with the target it belongs to: "ai:<backend>" or "tmux:<session>". The
  // transcript shows only the current target's messages, so switching in
  // Talk to… brings back that assistant's conversation. "ai:" (server
  // default / auto) shows every AI message, since auto can answer as any.
  var HIST_MAX = 400;
  var histKey = "tb_history:" + cfg.session;
  var history = [];
  try { history = JSON.parse(localStorage.getItem(histKey) || "[]") || []; } catch (e) { history = []; }
  if (!Array.isArray(history)) history = [];
  var histSaveTimer = null;
  function saveHistory() {
    if (histSaveTimer) return;
    histSaveTimer = setTimeout(function () {
      histSaveTimer = null;
      while (history.length > HIST_MAX) history.shift();
      try { localStorage.setItem(histKey, JSON.stringify(history)); } catch (e) {}
    }, 250);
  }
  function currentTargetKey() {
    // target/agentSessions are declared further down (hoisted vars); guard
    // for anything that writes to the transcript before they are assigned.
    if (typeof target === "object" && target && target.kind === "tmux") return "tmux:" + target.name;
    return "ai:" + (cfg.backend || "");
  }
  function normBackendKey(b) { return b === "ollama" ? "gemma" : b; }
  // Which target an event from the bridge belongs to. Shell names are
  // whatever the bridge lists in agentSessions (or anything that is not a
  // known model id); no backend means "whoever I am talking to now".
  function keyForEvent(ev) {
    var b = (ev && ev.backend) || "";
    if (!b) return currentTargetKey();
    var isShell = (agentSessions || []).some(function (x) { return x.name === b; }) ||
      !/^(gemma|claude|grok|ollama|auto|tmux)$/i.test(b);
    return isShell ? ("tmux:" + b) : ("ai:" + normBackendKey(b));
  }
  function histMatches(entry, key) {
    if (!entry) return false;
    var k = entry.tkey || "";
    if (k === key) return true;
    if (key === "ai:" && k.indexOf("ai:") === 0) return true;
    return false;
  }
  function histHasEvent(ev) {
    if (!ev || ev.id == null) return false;
    return history.some(function (h) { return h.id === ev.id && h.role === ev.role && h.text === ev.text; });
  }
  function renderMsg(entry) {
    var d = document.createElement("div");
    d.className = "msg " + entry.role;
    if (entry.tag) {
      var s = document.createElement("span");
      s.className = "tag";
      s.textContent = entry.tag;
      d.appendChild(s);
    }
    d.appendChild(document.createTextNode(entry.text));
    d._hist = entry;
    var t = $("transcript");
    t.appendChild(d);
    while (t.children.length > 60) t.removeChild(t.firstChild);
    return d;
  }
  // Repaint the transcript for the current target from history.
  function renderTranscript() {
    var t = $("transcript");
    if (!t) return;
    t.innerHTML = "";
    var key = currentTargetKey();
    var shown = history.filter(function (h) { return histMatches(h, key); });
    shown.slice(-60).forEach(renderMsg);
    t.scrollTop = t.scrollHeight;
  }
  // tkey: which target this belongs to (default: the current one). id: bridge
  // event id, for de-duplicating cached history against a fresh poll.
  function addMsg(role, text, tag, tkey, id) {
    var entry = { role: role, text: text, tag: tag || "", tkey: tkey || currentTargetKey(), ts: Date.now() };
    if (id != null) entry.id = id;
    history.push(entry);
    saveHistory();
    if (!histMatches(entry, currentTargetKey())) return null;
    var d = renderMsg(entry);
    $("transcript").scrollTop = $("transcript").scrollHeight;
    return d;
  }
  // Local send ack into the ONE transcript (tmux no longer leaves chat empty).
  function addTmuxSendAck(sessionName, text) {
    addMsg("user tmux-send", text, "→ 🖥 " + sessionName, "tmux:" + sessionName);
  }

  // After a send into a shell, pull the pane into THIS transcript so the
  // phone sees a reply (not only "Sent to …"). When Sound is on, speak a
  // short clip of the prose — leftover TUI box-drawing must never silence us.
  var paneWatch = null;
  var BOX_DRAW = /[│┃╭╮╰╯─┄━═▀▄█░┌┐└┘]/g;
  function stopPaneWatch() {
    if (paneWatch && paneWatch.timer) clearTimeout(paneWatch.timer);
    paneWatch = null;
  }
  function stripBoxDrawing(s) {
    return String(s || "").replace(BOX_DRAW, " ").replace(/\s+/g, " ").trim();
  }
  function isTuiChromeLine(L) {
    if (!L) return true;
    if (/Enter:queue|Alt\+Enter|Shift\+Tab|Ctrl\+[lx]|always-approve/.test(L)) return true;
    if (/Grok 4|Thought for \d|Compacting/.test(L)) return true;
    if (/\[hooks:|Context \d+% full/.test(L)) return true;
    if (/^(pre_tool_use|post_tool_use)/.test(L)) return true;
    if (/^(◆|❯|⠴|✔|✓|●|○|→|←)(\s|$)/.test(L)) return true;
    if (/^(Run |Read |Search |Write |Edit |Waiting for a )/i.test(L)) return true;
    return false;
  }
  function paneReplyText(raw) {
    var lines = String(raw || "").split("\n"), keep = [], i, L;
    for (i = 0; i < lines.length; i++) {
      L = stripBoxDrawing(lines[i]);
      if (!L) continue;
      L = L.replace(/\s+\d{1,2}:\d{2}\s*[AP]M\s*$/i, "").trim();
      if (isTuiChromeLine(L)) continue;
      keep.push(L);
    }
    if (keep.length > 20) keep = keep.slice(-20);
    return keep.join("\n");
  }
  function speakableClip(raw) {
    var lines = paneReplyText(raw || "").split("\n");
    var prose = [], rest = [], i, L;
    for (i = 0; i < lines.length; i++) {
      L = stripBoxDrawing(lines[i]);
      if (!L || L.length < 12) continue;
      rest.push(L);
      if (/[.!?]$/.test(L) || (L.length >= 24 && /^[A-Z]/.test(L) && /[a-z]/.test(L))) {
        prose.push(L);
      }
    }
    var t = (prose.length ? prose : rest).join(" ").replace(/\s+/g, " ").trim();
    if (!t) return "";
    if (t.length > 400) {
      var cut = t.slice(0, 400);
      var sp = cut.lastIndexOf(". ");
      t = (sp > 80 ? cut.slice(0, sp + 1) : cut).trim();
    }
    return t;
  }
  function clipCurated(t) {
    t = String(t || "").replace(/```[\s\S]*?```/g, " ").replace(/\s+/g, " ").trim();
    if (!t) return "";
    if (t.length > 400) {
      var cut = t.slice(0, 400);
      var sp = cut.lastIndexOf(". ");
      t = (sp > 80 ? cut.slice(0, sp + 1) : cut).trim();
    }
    return t;
  }
  function followPane(name, sent) {
    stopPaneWatch();
    paneWatch = { name: name, last: "", same: 0, el: null, ticks: 0 };
    paneWatch.el = addMsg("assistant", "Waiting for a reply from " + name + "…", "← " + name, "tmux:" + name);
    function paint(shown) {
      var lines = String(shown || "").split("\n");
      if (lines.length > 24) shown = lines.slice(-24).join("\n");
      if (!paneWatch.el || !paneWatch.el.parentNode) {
        // Target switched away (element gone) or never shown: update the
        // history entry in place rather than adding a second bubble.
        if (paneWatch.el && paneWatch.el._hist) { paneWatch.el._hist.text = shown; saveHistory(); return; }
        paneWatch.el = addMsg("assistant", shown, "← " + name, "tmux:" + name);
        return;
      }
      var d = paneWatch.el, tagEl = d.querySelector(".tag");
      if (d._hist) { d._hist.text = shown; saveHistory(); }
      d.textContent = "";
      if (!tagEl) {
        tagEl = document.createElement("span");
        tagEl.className = "tag";
      }
      tagEl.textContent = "← " + name;
      d.appendChild(tagEl);
      d.appendChild(document.createTextNode(shown));
      $("transcript").scrollTop = $("transcript").scrollHeight;
    }
    function finish(data) {
      var curated = ((data && data.curated) || "").trim();
      var pane = (data && data.text) || "";
      var shown = curated || paneReplyText(pane) || pane;
      if (shown) paint(shown);
      setStatus(shown ? ("Reply from " + name + ".") : ("Sent to " + name + "."));
      if (soundOn) {
        var clip = curated ? clipCurated(curated) : speakableClip(pane);
        speak(clip || (shown ? ("Reply is on the screen from " + name + ".") : ""));
      }
      stopPaneWatch();
    }
    function tick() {
      if (!paneWatch || paneWatch.name !== name) return;
      paneWatch.ticks++;
      var q = "/api/tmux/capture?name=" + encodeURIComponent(name) + "&lines=40";
      if (sent) q += "&after=" + encodeURIComponent(sent);
      api(q)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!paneWatch || paneWatch.name !== name) return;
          var curated = (data.curated || "").trim();
          var pane = (data.text || "").replace(/\s+$/, "");
          var shown = curated || paneReplyText(pane) || pane;
          var key = curated ? ("c:" + curated) : ("p:" + pane);
          var grok = data.source === "grok";
          if (shown && key !== paneWatch.last) {
            paneWatch.last = key;
            paneWatch.same = 0;
            paint(shown);
            setStatus("← " + name + " still writing…");
          } else {
            paneWatch.same++;
          }
          if (curated && data.complete) { finish(data); return; }
          if (!grok && (paneWatch.same >= 3 || paneWatch.ticks >= 30)) { finish(data); return; }
          if (grok && paneWatch.ticks >= 45) { finish(data); return; }
          paneWatch.timer = setTimeout(tick, 2000);
        })
        .catch(function () {
          if (paneWatch) paneWatch.timer = setTimeout(tick, 2500);
        });
    }
    paneWatch.timer = setTimeout(tick, 400);
  }

  // ---- backend picker (which AI answers: gemma / claude / grok / …) ----
  function backendLabel(b) {
    if (!b) return "auto";
    if (b === "ollama") return "gemma (ollama)";  // legacy id before server rename
    return b;
  }
  function fillBackends(list) {
    var sel = $("backendSel");
    if (sel.options.length || !list || !list.length) return;
    // Prefer gemma over legacy ollama when the bridge advertises both.
    var cleaned = list.filter(function (b) {
      return !(b === "ollama" && list.indexOf("gemma") >= 0);
    });
    window.__backends = [""].concat(cleaned);
    window.__backends.forEach(function (b) {
      var o = document.createElement("option");
      o.value = b;
      o.textContent = backendLabel(b);
      sel.appendChild(o);
    });
    // Migrate saved preference ollama → gemma when gemma exists.
    if (cfg.backend === "ollama" && list.indexOf("gemma") >= 0) {
      cfg.backend = "gemma";
      try { localStorage.setItem("tb_backend", "gemma"); } catch (e) {}
    }
    if (cfg.backend && cleaned.indexOf(cfg.backend) >= 0) sel.value = cfg.backend;
    else sel.value = "";
    sel.onchange = function () {
      cfg.backend = sel.value;
      try { localStorage.setItem("tb_backend", cfg.backend); } catch (e) {}
      if (target.kind === "ai") target.name = cfg.backend;
      paintTalkForTarget();
      paintTargetChip();
    };
  }

  // What may be read aloud. User content must never be spoken back.
  // Tmux used to emit "Sent to <session>: <full user text>" as an assistant
  // event, which the poll path then TTS'd — that is the "repeats everything"
  // / "Sent to grok harlan …" the owner heard.
  function shouldSpeakAssistant(ev) {
    if (!ev || !ev.text) return false;
    var t = String(ev.text).trim();
    if (!t) return false;
    if (/^Sent to\b/i.test(t)) return false;          // tmux receipt
    if (/^Sent\.?$/i.test(t)) return false;
    if (/[│┃╭╮]/.test(t)) return false;               // TUI chrome, not prose
    if (t.length > 800) return false;                 // don't orate a pane dump
    // Shell session names (grok-harlan, ai-g, …): followPane speaks a clip.
    if (ev.backend && !/^(gemma|claude|grok|ollama|auto|tmux)?$/i.test(ev.backend))
      return false;
    if (/\. Send\?$/i.test(t)) return false;          // old confirm readback shape
    // Errors are status-line material; don't orate a 502 JSON blob.
    if (/^AI backend failed/i.test(t)) return false;
    if (/^grok CLI failed/i.test(t)) return false;
    if (t.charAt(0) === "{") return false;
    return true;
  }

  // ---- spoken replies ----------------------------------------------------
  // Phone-like duplex: one AudioContext + one mic stream (PlayAndRecord).
  // TTS plays through THAT context, not a separate <audio> element — iOS
  // ducks HTMLAudio when getUserMedia is open. Barge-in is energy-only on
  // the same mic (AEC on). Fallback: sentence-peek if decode/WebAudio fails.
  var ttsGen = 0, ttsPeeking = false, peekCtl = null;
  var call = null, ttsNode = null, bargeProc = null;

  function ensureCall(ok, fail) {
    if (call && call.stream && call.ctx) {
      try { if (call.ctx.state === "suspended" && call.ctx.resume) call.ctx.resume(); } catch (e) {}
      ok(call);
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    }).then(function (stream) {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      if (ctx.resume) ctx.resume();
      call = { stream: stream, ctx: ctx, src: ctx.createMediaStreamSource(stream) };
      ok(call);
    }).catch(function (e) { if (fail) fail(e); });
  }
  function stopTtsNode() {
    if (!ttsNode) return;
    try { ttsNode.onended = null; ttsNode.stop(0); } catch (e) {}
    try { ttsNode.disconnect(); } catch (e) {}
    ttsNode = null;
  }
  function stopBarge() {
    if (!bargeProc) return;
    try { bargeProc.disconnect(); bargeProc.onaudioprocess = null; } catch (e) {}
    bargeProc = null;
  }
  function startBargeWatch(onHit) {
    stopBarge();
    if (!call) return;
    var proc = call.ctx.createScriptProcessor(2048, 1, 1);
    var speechMs = 0, armed = false;
    // Ignore the first 250ms (TTS attack / AEC settling) so we don't
    // immediately "hear" the speaker as the user.
    setTimeout(function () { armed = true; }, 250);
    proc.onaudioprocess = function (e) {
      if (!armed || !bargeProc) return;
      var buf = e.inputBuffer.getChannelData(0);
      var n = buf.length, sum = 0, j;
      for (j = 0; j < n; j++) sum += buf[j] * buf[j];
      var rms = Math.sqrt(sum / n);
      var ms = (n / call.ctx.sampleRate) * 1000;
      if (rms >= 0.055) speechMs += ms; else speechMs = 0;
      if (speechMs >= 140) { stopBarge(); onHit(); }
    };
    call.src.connect(proc);
    proc.connect(call.ctx.destination);
    bargeProc = proc;
  }
  function releaseCall() {
    stopBarge();
    stopTtsNode();
    stopPeek();
    if (!call) return;
    try { call.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { call.ctx.close(); } catch (e) {}
    call = null;
  }
  function playOnCall(blob, then) {
    if (!call || !call.ctx) { then(new Error("no call")); return; }
    var ctx = call.ctx;
    blob.arrayBuffer().then(function (ab) {
      var copy = ab.slice(0);
      var once = false;
      var ok = function (buf) {
        if (once) return;
        once = true;
        stopTtsNode();
        var src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.onended = function () { if (ttsNode === src) ttsNode = null; then(); };
        ttsNode = src;
        try { src.start(0); } catch (e) { then(e); }
      };
      var bad = function (e) { if (once) return; once = true; then(e || new Error("decode")); };
      var p = ctx.decodeAudioData(copy, ok, bad);
      if (p && p.then) p.then(ok).catch(bad);
    }).catch(then);
  }

  function splitSentences(text) {
    var t = String(text || "").replace(/\s+/g, " ").trim();
    if (!t) return [];
    var bits = t.split(/([.!?]+["')\]]*)\s+/);
    var out = [], i;
    for (i = 0; i < bits.length; i += 2) {
      var s = ((bits[i] || "") + (bits[i + 1] || "")).trim();
      if (!s) continue;
      if (out.length && s.length < 16) out[out.length - 1] += " " + s;
      else out.push(s);
    }
    return out.length ? out : [t];
  }
  function stopPeek() {
    if (peekCtl) { try { peekCtl.stop(); } catch (e) {} peekCtl = null; }
    ttsPeeking = false;
  }
  function cancelSpokenReply() {
    ttsGen++;
    stopPeek();
    stopBarge();
    stopTtsNode();
    try { audioEl.pause(); } catch (e) {}
    ttsPlaying = false;
    ttsPeeking = false;
  }
  function fetchTtsBlob(sentence) {
    return api("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: sentence })
    }).then(function (r) {
      if (!r.ok) throw new Error("TTS HTTP " + r.status);
      return r.blob();
    });
  }
  // Energy-only barge-in. High threshold + short window so echo tail of the
  // last sentence does not steal the next one.
  function peekBargeIn(done) {
    var settled = false;
    function settle(hit) {
      if (settled) return;
      settled = true;
      ttsPeeking = false;
      peekCtl = null;
      paintTalkForTarget();
      done(!!hit);
    }
    if (!dictateLoop || !micSupported()) { settle(false); return; }
    ttsPeeking = true;
    paintTalkForTarget();
    var decay = setTimeout(function () {
      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
      }).then(function (stream) {
        var AC = window.AudioContext || window.webkitAudioContext;
        var ctx = new AC();
        if (ctx.resume) ctx.resume();
        var src = ctx.createMediaStreamSource(stream);
        var proc = ctx.createScriptProcessor(2048, 1, 1);
        var speechMs = 0, elapsed = 0;
        function stop() {
          try { proc.disconnect(); proc.onaudioprocess = null; } catch (e) {}
          try { src.disconnect(); } catch (e) {}
          try { stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
          try { ctx.close(); } catch (e) {}
        }
        peekCtl = { stop: function () { stop(); settle(false); } };
        proc.onaudioprocess = function (e) {
          var buf = e.inputBuffer.getChannelData(0);
          var n = buf.length, sum = 0, j;
          for (j = 0; j < n; j++) sum += buf[j] * buf[j];
          var rms = Math.sqrt(sum / n);
          var ms = (n / ctx.sampleRate) * 1000;
          elapsed += ms;
          if (rms >= 0.05) speechMs += ms; else speechMs = 0;
          if (speechMs >= 90) { stop(); settle(true); return; }
          if (elapsed >= 380) { stop(); settle(false); }
        };
        src.connect(proc);
        proc.connect(ctx.destination);
      }).catch(function () { settle(false); });
    }, 180);
    peekCtl = { stop: function () { clearTimeout(decay); settle(false); } };
  }

  function speak(text, onDone) {
    // Meeting situation (continuous) is silent by construction.
    // ALWAYS complete: if TTS/play fails, hands-free must still re-listen.
    var finished = false;
    var gen = ++ttsGen;
    function finish() {
      if (finished) return;
      finished = true;
      if (gen !== ttsGen) return;
      ttsPlaying = false;
      ttsPeeking = false;
      stopPeek();
      if (onDone) {
        try { onDone(); } catch (e) {}
      }
      if (handsFree && awaitingReply) scheduleRelisten(250);
      maybeResumeAfterTts();
    }
    if (!soundOn || continuousMode || micMode === "continuous" || !text) {
      finish();
      return;
    }
    ttsPlaying = true;
    // Shell TTS used to hush the channel and never set this, so grok-harlan
    // replies left the mic off until the owner tapped Talk again.
    if (dictateLoop) resumeAfterTts = true;
    hushMic();
    setTimeout(function () { if (gen === ttsGen && !finished) finish(); }, 120000);

    function bargeHit() {
      if (gen !== ttsGen || finished) return;
      cancelSpokenReply();
      resumeAfterTts = false;
      clearReplyWait();
      setStatus("You have the floor.");
      if (dictateLoop) startDictate();
      paintTalkForTarget();
    }

    function playBlob(blob, then) {
      if (gen !== ttsGen) return;
      if (audioEl.src && audioEl.src.indexOf("blob:") === 0) {
        URL.revokeObjectURL(audioEl.src);
      }
      audioEl.src = URL.createObjectURL(blob);
      var onPlayDone = function () {
        audioEl.removeEventListener("ended", onPlayDone);
        audioEl.removeEventListener("error", onPlayDone);
        then();
      };
      audioEl.addEventListener("ended", onPlayDone);
      audioEl.addEventListener("error", onPlayDone);
      var p = audioEl.play();
      if (p && p.catch) p.catch(function () { then(); });
    }
    function playDuplex(blob) {
      paintTalkForTarget();
      playOnCall(blob, function (err) {
        stopBarge();
        if (gen !== ttsGen) return;
        if (err) { playSplit(); return; }
        finish();
      });
      startBargeWatch(bargeHit);
    }
    function playSplit() {
      var parts = (dictateLoop && target.kind !== "tmux") ? splitSentences(text) : [text];
      var blobs = [];
      function goPrefetch(k) {
        if (k >= parts.length || blobs[k]) return;
        fetchTtsBlob(parts[k]).then(function (b) { blobs[k] = b; })
          .catch(function () { blobs[k] = null; });
      }
      function playIndex(i) {
        if (gen !== ttsGen || finished) return;
        if (i >= parts.length) { finish(); return; }
        ttsPeeking = false;
        paintTalkForTarget();
        var go = function (blob) {
          if (gen !== ttsGen) return;
          if (!blob) { playIndex(i + 1); return; }
          playBlob(blob, function () {
            if (gen !== ttsGen || finished) return;
            if (i >= parts.length - 1) { finish(); return; }
            goPrefetch(i + 2);
            if (dictateLoop && soundOn) {
              peekBargeIn(function (hit) {
                if (gen !== ttsGen) return;
                if (hit) { bargeHit(); return; }
                playIndex(i + 1);
              });
            } else playIndex(i + 1);
          });
          goPrefetch(i + 1);
        };
        if (blobs[i]) go(blobs[i]);
        else fetchTtsBlob(parts[i]).then(go).catch(function (e) {
          if (i === 0) {
            setStatus("Speech failed: " + ((e && e.message) || e), true);
            finish();
          } else playIndex(i + 1);
        });
      }
      playIndex(0);
    }

    if (dictateLoop && micSupported()) {
      ensureCall(function () {
        fetchTtsBlob(text).then(function (blob) {
          if (gen !== ttsGen) return;
          playDuplex(blob);
        }).catch(function () { playSplit(); });
      }, function () { playSplit(); });
    } else {
      playSplit();
    }
  }

  // ---- polling (console mode keeps the car screen in sync with the phone) ----
  function poll() {
    api("/api/events?session=" + encodeURIComponent(cfg.session) + "&since=" + lastEventId)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        setConn(true);
        fillBackends(data.backends);
        data.events.forEach(function (ev) {
          // overlapping polls on slow LTE return the same events — render once
          if (ev.id <= lastEventId) return;
          lastEventId = ev.id;
          if (paneWatch && ev.backend && ev.backend === paneWatch.name) {
            if (ev.role === "assistant") lastSpokenId = ev.id;
            return;
          }
          // Cached history already holds this one (page reload): don't
          // repeat it, and don't speak it either.
          if (firstPoll && histHasEvent(ev)) { if (ev.role === "assistant") lastSpokenId = ev.id; return; }
          addMsg(ev.role, ev.text, ev.backend, keyForEvent(ev), ev.id);
          if (ev.role === "error" && resumeAfterTts) {
            resumeAfterTts = false;
            clearReplyWait();
            if (dictateLoop) resumeDictateNow();
          }
          if (ev.role === "assistant" && !firstPoll && ev.id > lastSpokenId) {
            lastSpokenId = ev.id;
            // Speak only real AI answers. Never speak "Sent to …: <user text>"
            // (tmux receipt) or other receipts that repeat what the user said.
            if (shouldSpeakAssistant(ev)) speak(ev.text);
            else if (resumeAfterTts) {
              resumeAfterTts = false;
              clearReplyWait();
              if (dictateLoop) resumeDictateNow();
            }
          }
        });
        if (firstPoll) {
          firstPoll = false;
          lastSpokenId = lastEventId;
          setStatus("Connected — AI backend: " + (data.backend || "?"));
        }
      })
      .catch(function (e) {
        setConn(false); setStatus(e.message, true);
        reportError("assistant/poll", e.message);   // e.g. bad token, HTTP 5xx
      });
  }

  // ---- typed input (works everywhere, the only console-native input) ----
  function sendTyped() {
    var input = $("barInput");
    if (!input) return;
    var text = input.value.trim();
    if (!text) return;
    if (target.kind === "tmux") {          // same box, different verb + safety
      if (!agentSendable) {
        setStatus("That session is read-only (not in tmux-allow).", true);
        return;
      }
      agentSend();                         // reads + clears the box
      return;
    }
    input.value = "";
    setStatus("Thinking…");
    if ($("barSend")) $("barSend").disabled = true;
    api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: cfg.session, message: text, backend: cfg.backend })
    }).then(function () { setStatus(""); })
      .catch(function (e) {
        if (input && !(input.value || "").trim()) input.value = text;
        setStatus(e.message, true);
      })
      .then(function () { paintTalkForTarget(); });

  function resetCvad() { cvad = { speaking: false, silenceMs: 0, frames: [], preRoll: [], total: 0 }; }

  // A live line pinned to the bottom of the transcript so you can watch it work
  // in real time: "hearing you…" while you speak, "transcribing…" after a pause.
  function setInterim(text) {
    var t = $("transcript"), el = $("interim");
    if (!text) { if (el) el.parentNode.removeChild(el); return; }
    if (!el) { el = document.createElement("div"); el.id = "interim"; el.className = "msg interim"; t.appendChild(el); }
    else if (el !== t.lastChild) { t.appendChild(el); }   // keep it at the bottom

  // agent dictation). CFRAME is the ScriptProcessor buffer size.
  var CFRAME = 4096, CHANG_MS = 1400, CMIN_MS = 350, CMAX_MS = 22000, CPREROLL = 4;

    var ratio = rate / 16000, n = Math.floor(frame.length / ratio), out = new Float32Array(n);
    for (var i = 0; i < n; i++) {

    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true);

  function contEndUtterance() {

    var merged = new Float32Array(total), off = 0;
    frames.forEach(function (f) { merged.set(f, off); off += f.length; });
    setInterim("⏳ transcribing…");
    var fd = new FormData();
    fd.append("audio", encodeWav16k(merged), "clip.wav");
    fd.append("session", cfg.session);
    fd.append("chat", "0");            // transcribe only — no AI reply per utterance
    fd.append("save", "1");            // persist each utterance on the workstation
    fd.append("backend", cfg.backend);
    fd.append("speaker", contSpeaker); // dual input: whose voice this utterance is
    var spokenBy = contSpeaker;        // capture — the toggle may flip mid-flight
    api("/api/transcribe", { method: "POST", body: fd })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        setInterim("");   // clear the live line; the final text takes its place
        // chat=0 emits no server event, so render it here (device-local transcript)
        if (data && data.text) {
          contTranscript.push("[" + spokenBy + "] " + data.text);
          addMsg("user", (spokenBy === "source" ? "📻 " : "🗣 ") + data.text);
          setStatus("Continuous transcription on — just talk.");
        }
      })
      .catch(function (e) { setInterim(""); setStatus("Transcribe error: " + e.message, true); });
  }
  // On-demand: send the accumulated transcript for a TEXT analysis (no audio,
  // and via a side session so it doesn't disturb the running transcript sync).
  // Runs as a BACKGROUND job: it never touches the main status line and the
  // result waits in a separate pane — the live transcript flow is never
  // interrupted. Progress/ready state is shown only on the button itself.
  var analysisResults = [];   // newest first
  var analysisRunning = false, analysisUnseen = 0;
  function paintAnalyzeBtn() {
    var a = $("analyzeBtn");
    if (!a) return;
    if (analysisRunning) {
      a.textContent = analysisUnseen
        ? "🧠 analyzing… (" + analysisUnseen + " ready)"
        : "🧠 analyzing…";
    } else if (analysisUnseen) {
      a.textContent = "🧠 " + analysisUnseen + " analysis ready — view";
    } else {
      a.textContent = "🧠 Analyze transcript";
    }
  }
  function showAnalysisPane() {
    var body = analysisResults.length
      ? analysisResults.map(function (r) { return "— " + r.at + " —\n" + r.text; }).join("\n\n")
      : "No analyses yet.";
    openSheet("🧠 Transcript analyses", [{
      html: '<div style="white-space:pre-wrap; font-size:15px; line-height:1.5"></div>'
    }]);
    $("sheetBody").firstChild.firstChild.textContent = body;
    analysisUnseen = 0;
    paintAnalyzeBtn();
  }
  // Second-tier retranscription: while listening, ask the bridge (on a slow
  // timer) to redo saved clips with the big context-aware model. Fast text
  // shows instantly; the refined transcript accumulates server-side and is
  // what analyses prefer. Fire-and-forget — never touches the capture flow.
  var refineTimer = null;
  function triggerRefine() {
    api("/api/refine", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: cfg.session })
    }).catch(function () { /* background nicety — silent */ });
  }
  function syncRefineTimer() {
    if (continuousMode && !refineTimer) {
      refineTimer = setInterval(triggerRefine, 90000);
    } else if (!continuousMode && refineTimer) {
      clearInterval(refineTimer); refineTimer = null;
      triggerRefine();   // one last pass to pick up the tail of the session
    }
  }

  function analyzeTranscript() {
    // Unseen result waiting and nothing running? The tap means "show me".
    if (analysisUnseen && !analysisRunning) { showAnalysisPane(); return; }
    if (analysisRunning) { showAnalysisPane(); return; }  // peek while it runs
    var live = contTranscript.join(" ").trim();
    if (!live) { setStatus("Nothing transcribed yet.", true); return; }
    analysisRunning = true;
    paintAnalyzeBtn();
    // Prefer the refined (large-model, context-corrected) transcript when the
    // bridge has one; fall back to the fast live text.
    api("/api/transcript?session=" + encodeURIComponent(cfg.session + "-refined"))
      .then(function (r) { return r.json(); })
      .then(function (d) { return (d && d.text && d.text.trim()) || live; })
      .catch(function () { return live; })
      .then(function (text) { runAnalysis(text); });
  }
  function runAnalysis(text) {
    api("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session: cfg.session + "-analyze",
        message: "Analyze this transcript and respond with text only. Lines " +
                 "tagged [source] are audio the listener was playing (e.g. a " +
                 "podcast); lines tagged [me] are the listener's own comments " +
                 "and questions — treat [me] lines as the voice to answer and " +
                 "relate them to the [source] content:\n\n" + text,
        backend: cfg.backend,
        save_as: cfg.session,        // persist the analysis on the workstation,
        save_label: "analysis"       // alongside the utterances it analyzed
      })
    }).then(function (r) { return r.json(); })
      .then(function (data) {
        analysisResults.unshift({
          at: new Date().toLocaleTimeString(),
          text: data.reply || "(no analysis returned)"
        });
        analysisUnseen += 1;
        addMsg("assistant", "🧠 analysis ready — tap 🧠 to read it", "notice");
      })
      .catch(function (e) {
        analysisResults.unshift({ at: new Date().toLocaleTimeString(),
                                  text: "Analyze error: " + e.message });
        analysisUnseen += 1;
      })
      .then(function () { analysisRunning = false; paintAnalyzeBtn(); });
  }
  function contOnAudio(e) {
    var input = e.inputBuffer.getChannelData(0);
    var frame = downsampleTo16k(new Float32Array(input), contRate);
    var n = frame.length, sum = 0, i;
    for (i = 0; i < n; i++) sum += frame[i] * frame[i];
    var rms = Math.sqrt(sum / n), frameMs = (n / 16000) * 1000;
    if (rms >= 0.02) {                 // speaking
      if (!cvad.speaking) {
        cvad.speaking = true;
        cvad.frames = cvad.preRoll.slice();
        cvad.total = cvad.frames.reduce(function (a, f) { return a + f.length; }, 0);
        setInterim("🎙 hearing you…");   // live feedback the moment you start
      }
      cvad.frames.push(frame); cvad.total += n; cvad.silenceMs = 0;
    } else if (cvad.speaking) {         // trailing silence
      cvad.frames.push(frame); cvad.total += n; cvad.silenceMs += frameMs;
      if (cvad.silenceMs >= CHANG_MS) { contEndUtterance(); return; }
    } else {                           // pre-roll ring buffer while quiet
      cvad.preRoll.push(frame);

  }
  // Keep the phone awake while a listening mode is active — iOS suspends the
  // page (and the mic) when the screen sleeps. The screen may dim but won't
  // lock; the lock is dropped whenever no mode needs the mic.
  var wakeLock = null;
  function syncWakeLock() {
    var need = continuousMode || handsFree;
    if (need && !wakeLock && "wakeLock" in navigator) {
      navigator.wakeLock.request("screen").then(function (l) {
        wakeLock = l;
        l.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () { /* not fatal — listening still works while awake */ });
    } else if (!need && wakeLock) {
      try { wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }
  }

  // back the moment the page is visible again.

  function startContinuous() {
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    }).then(function (stream) {

    if (contSrc) { try { contSrc.disconnect(); } catch (e) {} }
    if (contStream) contStream.getTracks().forEach(function (t) { t.stop(); });

  // audio being listened to ("source" — a podcast, a sermon, a video), so the
  // saved transcript and the analysis can tell the two apart.
  var contSpeaker = "me";

    var sp = $("speakerToggle");
    if (!sp) return;
    sp.textContent = contSpeaker === "me" ? "🗣 Tagging: me" : "📻 Tagging: source";
    sp.className = contSpeaker === "me" ? "secondary" : "";

      ? "Utterances are tagged as YOUR comments. Tap to tag as the audio you're listening to."
      : "Utterances are tagged as the SOURCE audio (podcast etc.). Tap to tag as your own comments.";
  }

  // ---- the one capture engine ---------------------------------------------
  // WAV @16k straight from WebAudio, never MediaRecorder: a webm/mp4 clip
  // makes the bridge shell out to ffmpeg before Whisper can start, which was
  // most of the round-trip delay. Continuous mode and agent dictation already
  // used this path; tap-to-talk and hands-free now share it.
  //   capture({hangMs, maxMs, onDone}) -> starts; capture.stop() finishes early.
  var capState = null;   // {stream, ctx, src, proc, vad, opts}

  function captureRunning() { return !!capState; }

    if (capState && capState.vad) capState.vad.silenceMs = 1e9;   // flush next frame
  }

    if (!capState) return;
    try { capState.proc.disconnect(); capState.proc.onaudioprocess = null; } catch (e) {}
    try { capState.src.disconnect(); } catch (e) {}
    try { capState.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { capState.ctx.close(); } catch (e) {}

  function capture(opts) {
    if (capState || micStarting) return;

      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }

        var frame = downsampleTo16k(new Float32Array(e.inputBuffer.getChannelData(0)), rate);
        var n = frame.length, sum = 0, i;

        var rms = Math.sqrt(sum / n), ms = (n / 16000) * 1000;
        v.elapsed += ms;
        if (rms >= 0.02) { v.speaking = true; v.silenceMs = 0; v.frames.push(frame); v.total += n; }
        else if (v.speaking) {
          v.frames.push(frame); v.total += n; v.silenceMs += ms;
          if (v.silenceMs >= (opts.hangMs || 1400)) { captureFinish(); return; }
        }
        if (v.elapsed >= (opts.maxMs || 22000)) captureFinish();

      proc.connect(ctx.destination);         // required for onaudioprocess to fire
      if (opts.onStart) opts.onStart();
    }).catch(function (e) {
      micStarting = false;
      // The Tesla console reports mic hardware but never grants getUserMedia
      // (no permission UI) — so this rejects with NotAllowedError there.
      var denied = e && (e.name === "NotAllowedError" ||
        /denied|permission|not ?allowed/i.test(e.message || ""));
      setStatus(denied
        ? "This browser won't grant microphone access. The Tesla console has no " +
          "mic — open this page on your phone (add ?mode=mic) and talk there; the " +
          "question and answer still appear and speak on the car."

      if (opts.onFail) opts.onFail(e);

    if (!capState) return;
    var v = capState.vad, opts = capState.opts;
