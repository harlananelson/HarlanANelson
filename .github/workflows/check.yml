name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check scripts and functions
        run: for f in *.js netlify/functions/*.js netlify/functions/*.mjs netlify/lib/*.js; do node --check "$f"; done
      - name: Unit tests (function guard)
        run: node --test netlify/
