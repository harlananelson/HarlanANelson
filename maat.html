<title>Maat</title>
<style>
  /* Maat: one installable shell. Modes load existing apps in iframes — no
     backend change. Listen + Converse + Tools need Tailscale where noted.
     Practice embeds public languages.html (shareable; no Tailscale). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 100dvh so the shell fills the phone; #views (flex:1 + min-height:0) then
     leaves a real iframe height *above* the tab bar. */
  html, body { height: 100%; height: 100dvh; max-height: 100dvh; }
  body {
    background: #0f1419; color: #e8e6e1;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #banner {
    display: none; background: #4a1f1c; color: #ffb4a8; font-size: 14px;
    padding: 10px 14px; line-height: 1.4; white-space: pre-wrap; cursor: pointer;
    border-bottom: 1px solid #6b2a25;
  }
  #banner.show { display: block; }
  #views { position: relative; flex: 1; min-height: 0; }
  .view {
    position: absolute; inset: 0; display: none;
    border: 0; width: 100%; height: 100%; background: #0f1419;
  }
  .view.active { display: block; }
  .panel {
    position: absolute; inset: 0; display: none;
    overflow-y: auto; padding: 28px 22px 40px; max-width: 640px; margin: 0 auto;
  }
  .panel.active { display: block; }
  .panel h1 {
    font-size: 28px; font-weight: 600; letter-spacing: 0.02em;
    color: #e8e6e1; margin-bottom: 6px;
  }
  .panel .tagline { color: #c8a36c; font-size: 17px; margin-bottom: 20px; line-height: 1.4; }
  .panel p { font-size: 16px; line-height: 1.55; color: #b8b4ac; margin-bottom: 14px; }
  .panel ul { margin: 0 0 16px 1.2em; color: #b8b4ac; font-size: 15px; line-height: 1.5; }
  .panel li { margin-bottom: 6px; }
  .panel .note {
    margin-top: 20px; padding: 14px 16px; border-radius: 12px;
    background: #1a222c; border: 1px solid #2a3540; font-size: 14px; color: #9aa3ad;
  }
  .panel code { font-size: 13px; color: #c8a36c; }
  #tabs {
    display: flex; background: #151c24; border-top: 1px solid #2a3540;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  #tabs button {
    flex: 1; background: none; border: 0; color: #7a8490; cursor: pointer;
    padding: 10px 4px 12px; font-size: 11px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  #tabs button .ic { font-size: 22px; line-height: 1; }
  #tabs button.sel { color: #c8a36c; }
  #tabs button.gear { flex: 0 0 56px; }
  #settings {
    position: absolute; inset: 0; z-index: 10; display: none;
    flex-direction: column; background: #121820; padding: 22px;
    overflow-y: auto; gap: 6px;
  }
  #settings.open { display: flex; }
  #settings h1 { font-size: 22px; margin-bottom: 6px; color: #e8e6e1; }
  #settings p.note { font-size: 14px; color: #8a939e; line-height: 1.5; margin-bottom: 10px; }
  #settings label { display: block; font-size: 14px; color: #9aa3ad; margin: 14px 0 5px; }
  #settings input {
    width: 100%; font-size: 16px; padding: 12px; border-radius: 10px;
    border: 1px solid #3a4550; background: #1a222c; color: #e8e6e1;
  }
  #settings .row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  #settings button {
    background: #c8a36c; color: #0f1419; border: 0; border-radius: 12px;
    font-size: 17px; padding: 13px 20px; cursor: pointer; font-weight: 600;
  }
  #settings button.secondary { background: #2a3540; color: #e8e6e1; font-weight: 500; }
  .empty {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 28px; color: #9aa3ad;
  }
  .empty.active { display: flex; }
  .empty h2 { font-size: 20px; color: #e8e6e1; }
  .empty button {
    background: #c8a36c; color: #0f1419; border: 0; border-radius: 12px;
    font-size: 16px; padding: 12px 18px; cursor: pointer; font-weight: 600;
  }
  /* Tools destination: chip bar + stacked iframes (last tool shown immediately) */
  .tools-wrap {
    display: none; flex-direction: column; position: absolute; inset: 0;
    background: #0f1419;
  }
  .tools-wrap.active { display: flex; }
  .tools-bar {
    display: flex; gap: 8px; padding: 8px 10px;
    background: #151c24; border-bottom: 1px solid #2a3540;
    flex-shrink: 0; align-items: center;
  }
  .tools-bar button {
    flex: 1; background: #1a222c; border: 1px solid #2a3540; color: #9aa3ad;
    border-radius: 10px; padding: 10px 8px; font-size: 14px; font-weight: 500;
    cursor: pointer; touch-action: manipulation;
  }
  .tools-bar button.sel {
    color: #0f1419; background: #c8a36c; border-color: #c8a36c; font-weight: 600;
  }
  .tools-note {
    font-size: 11px; color: #6a7380; padding: 4px 10px 6px;
    background: #151c24; border-bottom: 1px solid #2a3540; flex-shrink: 0;
  }
  .tools-frames { position: relative; flex: 1; min-height: 0; }
  .tools-frames iframe {
    position: absolute; inset: 0; border: 0; width: 100%; height: 100%;
    background: #0f1419; display: none;
  }
  .tools-frames iframe.active { display: block; }
  #toolPicker {
    display: none; position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,.55); align-items: flex-end; justify-content: center;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0));
  }
  #toolPicker.open { display: flex; }
  #toolPicker .card {
    width: 100%; max-width: 420px; background: #161b22; border: 1px solid #30363d;
    border-radius: 16px; padding: 14px; color: #e8e6e1;
  }
  #toolPicker .card h2 { font-size: 17px; margin-bottom: 10px; }
  #toolPicker .card button.row {
    display: block; width: 100%; text-align: left; margin: 0 0 10px;
    background: #1a222c; border: 1px solid #2a3540; color: #e8e6e1;
    border-radius: 12px; padding: 14px 16px; font-size: 17px; cursor: pointer;
  }
  #toolPicker .card .row-note { font-size: 13px; color: #8a939e; margin: -4px 0 12px 4px; }
  #toolPicker .card button.cancel {
    width: 100%; background: #2a3540; border: 0; color: #e8e6e1;
    border-radius: 12px; padding: 12px; font-size: 16px; cursor: pointer; margin-top: 4px;
  }
</style>
</head>
<body>

<div id="banner"></div>
<div id="views"></div>

<div id="toolPicker" role="dialog" aria-label="Choose tool">
  <div class="card">
    <h2>Tools</h2>
    <div id="toolPickerBody"></div>
    <button type="button" class="cancel" id="toolPickerClose">Cancel</button>
  </div>
</div>

<div id="settings">
  <h1>Maat</h1>
  <div id="aboutPanel" class="note" style="margin-bottom:14px"></div>
  <p class="note">URL overrides (this browser only). Listen, Converse, and Tools need
    Tailscale home backends. Practice is public. Blank a URL to show an empty
    placeholder for that surface (tab stays; clear the field to reset later).</p>
  <div id="settingsFields"></div>
  <div class="row">
    <button id="saveModes" type="button">Save</button>
    <button id="closeSettings" type="button" class="secondary">Cancel</button>
  </div>
</div>

<nav id="tabs" aria-label="Maat modes"></nav>

<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function reportError(source, message) {
    try {
      var bridge = (localStorage.getItem("tb_bridge") || "").replace(/\/+$/, "");
      var token = localStorage.getItem("tb_token") || "";
      if (bridge && token) {
        fetch(bridge + "/api/clientlog", {
          method: "POST",
          headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ source: source, message: String(message).slice(0, 900), ua: navigator.userAgent })
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function showBanner(text) {
    var b = $("banner");
    b.textContent = "⚠ " + text + "  (tap to dismiss)";
    b.className = "show";
  }
  var banner = $("banner");
  if (banner) banner.onclick = function () { banner.className = ""; };
  window.addEventListener("error", function (e) {
    var m = (e.message || "error") + " @ " + (e.filename || "") + ":" + (e.lineno || 0);
    reportError("maat.html", m); showBanner(m);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason; var m = "unhandledrejection: " + ((r && r.message) || r || "");
    reportError("maat.html", m); showBanner(m);
  });

  // Public Practice languages (allowlisted for deep links — never pass raw lang through).
  var PRACTICE_LANGS = { es: 1, en: 1, ja: 1, sw: 1 };

  // PR3: Music + reMarkable fold under Tools (last-tool memory + long-press).
  var TOOL_DEFS = [
    {
      id: "music",
      label: "Music",
      icon: "🎵",
      url: "https://harlan-b550-aorus-pro-ac.taila21a91.ts.net:8444/",
      hint: "Record or upload music — levels, clipping, spectrum, tempo, key (tailnet :8444). Full-rate capture; not the 16 kHz speech path."
    },
    {
      id: "remarkable",
      label: "reMarkable",
      icon: "📝",
      url: "https://harlan-b550-aorus-pro-ac.taila21a91.ts.net:9443/?listen=current&v=17",
      hint: "Phone → reMarkable. New job can use the current Maat Listen session (sermon/meeting) as input. Needs Tailscale + phone-bridge."
    }
  ];
  var TOOL_IDS = { music: 1, remarkable: 1 };
  var LAST_TOOL_KEY = "maat.tools.lastTool";
  var listenStem = "";
  function getWorkstationToken() {
    try { return (localStorage.getItem("tb_token") || "").trim(); } catch (e) { return ""; }
  }
  function setWorkstationToken(t) {
    try { localStorage.setItem("tb_token", (t || "").trim()); } catch (e) {}
  }
  function pushAuthToFrames() {
    var token = getWorkstationToken();
    if (!token) return;
    var msg = { type: "maat-auth", token: token };
    try { msg.bridge = localStorage.getItem("tb_bridge") || ""; } catch (e) {}
    document.querySelectorAll("iframe").forEach(function (f) {
      try { if (f.contentWindow) f.contentWindow.postMessage(msg, "*"); } catch (e) {}
    });
  }
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d) return;
    if (d.type === "maat-listen" && d.session) {
      listenStem = String(d.session).replace(/[^A-Za-z0-9._-]/g, "");
      return;
    }
    if (d.type === "maat-auth-please") pushAuthToFrames();
    if (d.type === "maat-auth-offer" && d.token) {
      if (!getWorkstationToken()) setWorkstationToken(d.token);
      if (d.bridge) {
        try { localStorage.setItem("tb_bridge", String(d.bridge)); } catch (e) {}
      }
      pushAuthToFrames();
    }
    if (d.type === "maat-rm-status") {
      var note = $("toolsNote");
      if (!note) return;
      if (d.state === "ok") note.textContent = "Connected to the workstation.";
      else if (d.state === "need-token") {
        note.textContent = getWorkstationToken()
          ? "Signing in with the Converse token…"
          : "Open ⚙ and paste the workstation token (same one as Converse).";
      } else if (d.state === "unreachable") {
        note.textContent = "Can't reach the box — check Tailscale.";
      }
    }
  });
  function remarkableUrl() {
    var t = toolById("remarkable");
    var base = (t && t.url) || "";
    try {
      var u = new URL(base, location.href);
      u.searchParams.set("listen", listenStem || "current");
      u.searchParams.set("v", "17");
      return u.href;
    } catch (e) {
      return base;
    }
  }

  // Peer destinations ≤4. About lives in gear (PR4), not the thumb bar.
  var MODE_IDS = { sermon: 1, practice: 1, converse: 1, tools: 1 };
  var DEFAULTS = [
    {
      id: "sermon",
      label: "Listen",
      icon: "🌐",
      url: "./live-translator.html",
      kind: "iframe",
      hint: "Listen to a service, a meeting or an appointment: transcription, translation when the profile calls for it, and analysis. Pick a profile inside. On iPad prefer the tailnet page if WebSocket fails."
    },
    {
      id: "practice",
      label: "Practice",
      icon: "🗣️",
      url: "./languages.html",
      kind: "iframe",
      public: true,
      hint: "Speech drills (ES/EN/JA/SW). Opens last language. Public and shareable — no Tailscale. Deep link: #practice or ?mode=practice&lang=es"
    },
    {
      id: "converse",
      label: "Converse",
      icon: "💬",
      // Mic-first + cache-bust after one-interface layout.
      url: "./assistant.html?v=88&mode=mic",
      kind: "iframe",
      hint: "Talk to a model or a workstation shell — type or speak. Deep link: #converse or #converse?input=mic. Needs Tailscale + tesla-bridge."
    },
    {
      id: "tools",
      label: "Tools",
      icon: "🛠️",
      url: "",
      kind: "tools",
      hint: "Music analyzer + reMarkable bridge. Opens last tool. Long-press this tab to jump. Needs Tailscale. Deep link: #tools?tool=music"
    }
  ];

  // When Maat itself is opened from the tailnet host with no port, Listen's
  // WebSocket is more reliable same-origin on :8443 than via the Netlify page.
  function defaultUrl(mode) {
    var onTailnetOriginNoPort =
      location.hostname.indexOf(".ts.net") >= 0 && location.port === "";
    if (onTailnetOriginNoPort && mode.id === "sermon") {
      return location.protocol + "//" + location.hostname + ":8443/";
    }
    return mode.url;
  }

  // Append/replace a query param on an existing URL without discarding a
  // Settings override host (e.g. tailnet assistant.html stays on that host).
  function withQueryParam(url, key, value) {
    var fallback = url || "./";
    try {
      var u = new URL(fallback, location.href);
      if (value === null || value === undefined || value === "") u.searchParams.delete(key);
      else u.searchParams.set(key, value);
      if (u.origin === location.origin) {
        var file = u.pathname.split("/").pop() || "";
        return "./" + file + u.search + u.hash;
      }
      return u.href;
    } catch (e) {
      return fallback;
    }
  }

  function getLastTool() {
    var t = null;
    try { t = localStorage.getItem(LAST_TOOL_KEY); } catch (e) {}
    if (t && TOOL_IDS[t]) return t;
    return "music";
  }
  function setLastTool(id) {
    if (!TOOL_IDS[id]) return;
    try { localStorage.setItem(LAST_TOOL_KEY, id); } catch (e) {}
  }

  function loadModes() {
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem("maat_urls") || "{}"); } catch (e) {}
    // Migrate pre-PR2 Voice/Assistant URL prefs into Converse (typed default).
    if (saved.converse === undefined) {
      if (saved.assistant) saved.converse = saved.assistant;
      else if (saved.voice) {
        saved.converse = String(saved.voice).replace(/([?&])mode=mic(&|$)/, "$1").replace(/[?&]$/, "");
        if (!saved.converse) saved.converse = "./assistant.html";
      }
    }
    return DEFAULTS.map(function (a) {
      var u = saved[a.id];
      var url = a.kind === "tools" ? "" : (u === undefined ? defaultUrl(a) : u);
      // Bust Safari/PWA cache for Converse after UI changes (Talk to… header).
      if (a.id === "converse" && url && url.indexOf("assistant.html") >= 0) {
        url = withQueryParam(url, "v", "83");
        if (url.indexOf("mode=") < 0) url = withQueryParam(url, "mode", "mic");
      }
      return {
        id: a.id, label: a.label, icon: a.icon, kind: a.kind, hint: a.hint,
        public: !!a.public,
        url: url
      };
    });
  }

  function loadTools() {
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem("maat_urls") || "{}"); } catch (e) {}
    return TOOL_DEFS.map(function (t) {
      return {
        id: t.id, label: t.label, icon: t.icon, hint: t.hint,
        url: (saved[t.id] === undefined ? t.url : saved[t.id])
      };
    });
  }

  function saveModes(modes, tools) {
    var m = {};
    modes.forEach(function (a) {
      if (a.kind === "about" || a.kind === "tools") return;
      m[a.id] = a.url;
    });
    (tools || []).forEach(function (t) { m[t.id] = t.url; });
    try { localStorage.setItem("maat_urls", JSON.stringify(m)); } catch (e) {}
  }

  var modes = loadModes();
  var tools = loadTools();
  var activeTool = getLastTool();
  // PR4: cold open always Converse (predictable). Deep links override below.
  // Do not restore last destination from localStorage.
  var active = "converse";

  function aboutHtml() {
    return (
      '<p class="tagline" style="margin:0 0 8px;color:#c8a36c">Right order for a whole digital life.</p>' +
      '<p style="margin:0 0 10px">One shell: <strong style="color:#e8e6e1">Listen</strong>, ' +
      '<strong style="color:#e8e6e1">Practice</strong>, <strong style="color:#e8e6e1">Converse</strong>, ' +
      '<strong style="color:#e8e6e1">Tools</strong>. Practice is public; the rest need Tailscale home backends.</p>' +
      '<p style="margin:0 0 6px"><strong style="color:#e8e6e1">Deep links</strong> — ' +
      '<code>#practice?lang=es</code> · <code>#converse?input=mic</code> · ' +
      '<code>#tools?tool=music</code> · <code>?mode=sermon</code></p>' +
      '<p style="margin:0;font-size:12px">Aliases: voice→Converse+mic, assistant→Converse, music/remarkable→Tools. ' +
      'Public drills stay at languages.html / *-speech-drill.html. Load failures (Tailscale/service down) ' +
      'surface as a banner after the iframe timeout — not by guessing connectivity from the page origin.</p>'
    );
  }

  function toolById(id) {
    for (var i = 0; i < tools.length; i++) if (tools[i].id === id) return tools[i];
    return tools[0];
  }

  function paintToolsBar() {
    var bar = $("toolsBar");
    if (!bar) return;
    bar.innerHTML = "";
    tools.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button";
      b.id = "tool-chip-" + t.id;
      b.textContent = t.icon + " " + t.label;
      if (t.id === activeTool) b.className = "sel";
      b.onclick = function () { selectTool(t.id); };
      bar.appendChild(b);
    });
  }

  function selectTool(id, opts) {
    opts = opts || {};
    if (!TOOL_IDS[id]) return;
    activeTool = id;
    setLastTool(id);
    paintToolsBar();
    tools.forEach(function (t) {
      var f = $("tool-frame-" + t.id);
      if (!f) return;
      var on = t.id === id;
      var want = t.id === "remarkable" ? remarkableUrl() : t.url;
      if (on && want && f.getAttribute("src") !== want) {
        watchIframeLoad(f, { id: "tools/" + t.id, label: t.label, url: want });
        f.src = want;
      }
      f.classList.toggle("active", on);
    });
    var note = $("toolsNote");
    if (note) {
      var t = toolById(id);
      note.textContent = (t.id === "remarkable")
        ? "Connecting…"
        : ("Needs the home box on Tailscale · " + (t.hint || t.label));
    }
    if (opts.showTools !== false) show("tools");
    if (id === "remarkable") pushAuthToFrames();
  }

  function openToolPicker() {
    var body = $("toolPickerBody");
    body.innerHTML = "";
    tools.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "row";
      b.textContent = (t.id === activeTool ? "● " : "○ ") + t.icon + " " + t.label;
      b.onclick = function () {
        closeToolPicker();
        selectTool(t.id);
      };
      body.appendChild(b);
      var n = document.createElement("div");
      n.className = "row-note";
      n.textContent = t.hint || "";
      body.appendChild(n);
    });
    $("toolPicker").classList.add("open");
  }
  function closeToolPicker() {
    $("toolPicker").classList.remove("open");
  }
  $("toolPickerClose").onclick = closeToolPicker;
  $("toolPicker").addEventListener("click", function (e) {
    if (e.target === $("toolPicker")) closeToolPicker();
  });

  function bindLongPress(el, onLong, onShort) {
    var timer = null;
    var longFired = false;
    var ignoreUntil = 0;
    var start = function () {
      longFired = false;
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () {
        timer = null;
        longFired = true;
        ignoreUntil = Date.now() + 600;
        onLong();
      }, 480);
    };
    var cancel = function () {
      if (timer) { clearTimeout(timer); timer = null; }
    };
    var end = function () {
      if (timer) { clearTimeout(timer); timer = null; }
      if (longFired) { longFired = false; return; }
      if (Date.now() < ignoreUntil) return;
      // Swallow the synthetic mouse pair that follows a touch tap.
      ignoreUntil = Date.now() + 400;
      onShort();
    };
    el.addEventListener("touchstart", start, { passive: true });
    el.addEventListener("touchend", end);
    el.addEventListener("touchcancel", cancel);
    el.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      start();
    });
    el.addEventListener("mouseup", end);
    el.addEventListener("mouseleave", cancel);
    el.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });
  }

  function build() {
    var views = $("views"); views.innerHTML = "";
    var tabs = $("tabs"); tabs.innerHTML = "";
    modes.forEach(function (a) {
      if (a.kind === "tools") {
        var wrap = document.createElement("div");
        wrap.className = "tools-wrap";
        wrap.id = "view-tools";
        wrap.innerHTML =
          '<div class="tools-bar" id="toolsBar"></div>' +
          '<div class="tools-note" id="toolsNote">Tools</div>' +
          '<div class="tools-frames" id="toolsFrames"></div>';
        views.appendChild(wrap);
        var frames = $("toolsFrames");
        tools.forEach(function (t) {
          var f = document.createElement("iframe");
          f.id = "tool-frame-" + t.id;
          f.setAttribute("allow", "microphone; autoplay; clipboard-write; clipboard-read; fullscreen");
          f.setAttribute("title", t.label);
          f.dataset.src = t.url || "";
          frames.appendChild(f);
        });
        paintToolsBar();
      } else if (a.url) {
        var f = document.createElement("iframe");
        f.className = "view"; f.id = "view-" + a.id;
        f.setAttribute("allow", "microphone; autoplay; clipboard-write; clipboard-read; fullscreen");
        f.setAttribute("title", a.label);
        // Public Practice: sandbox without top-navigation so drills cannot navigate the shell away.
        if (a.public || a.id === "practice") {
          f.setAttribute(
            "sandbox",
            "allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
          );
        }
        f.dataset.src = a.url;
        views.appendChild(f);
      } else {
        var e = document.createElement("div");
        e.className = "empty"; e.id = "view-" + a.id;
        e.innerHTML = "<h2>" + a.icon + " " + a.label + "</h2>" +
          "<p>No URL set. Open settings and paste the tool address.</p>";
        var b = document.createElement("button");
        b.type = "button"; b.textContent = "Open settings";
        b.onclick = function () { openSettings(true); };
        e.appendChild(b);
        views.appendChild(e);
      }
      var t = document.createElement("button");
      t.type = "button";
      t.id = "tab-" + a.id;
      t.innerHTML = '<span class="ic">' + a.icon + '</span>' + a.label;
      if (a.kind === "tools") {
        bindLongPress(t, function () { openToolPicker(); }, function () { show("tools"); });
      } else {
        t.onclick = function () { show(a.id); };
      }
      tabs.appendChild(t);
    });
    var gear = document.createElement("button");
    gear.type = "button";
    gear.className = "gear";
    gear.innerHTML = '<span class="ic">⚙️</span>';
    gear.setAttribute("aria-label", "Settings");
    gear.onclick = function () { openSettings(true); };
    tabs.appendChild(gear);

    var ids = modes.map(function (a) { return a.id; });
    if (ids.indexOf(active) < 0) active = "converse";
    show(active);
  }

  function watchIframeLoad(frame, app) {
    var done = false;
    // Failure-driven degradation: only banner when a frame actually fails/times out
    // (not when the shell is merely served from harlananelson.com with Tailscale up).
    var timer = setTimeout(function () {
      if (done) return;
      var m = app.label + " did not load (" + app.url + ") — is Tailscale on / service running?";
      reportError("maat.html/" + app.id, m); showBanner(m);
    }, 8000);
    frame.addEventListener("load", function () {
      done = true; clearTimeout(timer);
      pushAuthToFrames();
    });
    frame.addEventListener("error", function () {
      done = true; clearTimeout(timer);
      var m = app.label + " failed to load (" + app.url + ")";
      reportError("maat.html/" + app.id, m); showBanner(m);
    });
  }

  function srcHasCacheToken(cur, want) {
    var m = String(want || "").match(/[?&](v=[^&]+)/);
    if (!m) return !!cur;
    return String(cur).indexOf(m[1]) >= 0;
  }

  function show(id) {
    if (!MODE_IDS[id]) id = "converse";
    active = id;
    modes.forEach(function (a) {
      var v = $("view-" + a.id), t = $("tab-" + a.id);
      var on = a.id === id;
      if (v) {
        if (a.kind === "tools") {
          v.classList.toggle("active", on);
          if (on) selectTool(activeTool || getLastTool(), { showTools: false });
        } else {
          if (on && v.tagName === "IFRAME") {
            var want = a.url || v.dataset.src;
            var cur = v.getAttribute("src") || "";
            if (want && (!cur || (a.id === "converse" && !srcHasCacheToken(cur, want)))) {
              watchIframeLoad(v, a);
              v.src = want;
            }
          }
          v.classList.toggle("active", on);
        }
      }
      if (t) t.classList.toggle("sel", on);
    });
  }

  function openSettings(open) {
    if (open) {
      var about = $("aboutPanel");
      if (about) about.innerHTML = aboutHtml();
      var wrap = $("settingsFields"); wrap.innerHTML = "";
      var tokLab = document.createElement("label");
      tokLab.textContent = "Workstation token (all of Maat — Converse, Listen, reMarkable)";
      tokLab.htmlFor = "maatToken";
      var tokInp = document.createElement("input");
      tokInp.id = "maatToken";
      tokInp.type = "password";
      tokInp.autocomplete = "off";
      tokInp.autocapitalize = "off";
      tokInp.placeholder = "already saved if you signed in on Converse";
      tokInp.value = getWorkstationToken();
      wrap.appendChild(tokLab);
      wrap.appendChild(tokInp);
      var tokHint = document.createElement("p");
      tokHint.className = "note";
      tokHint.style.margin = "4px 0 16px";
      tokHint.style.fontSize = "12px";
      tokHint.textContent = "One bearer for the home box. Copied from Converse if you already entered it there.";
      wrap.appendChild(tokHint);
      modes.forEach(function (a) {
        if (a.kind === "tools") {
          var head = document.createElement("p");
          head.className = "note";
          head.style.marginTop = "16px";
          head.textContent = "Tools (Tailscale) — Music and reMarkable URLs";
          wrap.appendChild(head);
          tools.forEach(function (t) {
            var lab = document.createElement("label");
            lab.textContent = t.label + " URL";
            lab.htmlFor = "url-" + t.id;
            var inp = document.createElement("input");
            inp.id = "url-" + t.id; inp.value = t.url || "";
            inp.autocapitalize = "off"; inp.spellcheck = false;
            inp.placeholder = t.hint || "https://…";
            wrap.appendChild(lab); wrap.appendChild(inp);
            if (t.hint) {
              var h = document.createElement("p");
              h.className = "note"; h.style.margin = "4px 0 0";
              h.style.fontSize = "12px"; h.textContent = t.hint;
              wrap.appendChild(h);
            }
          });
          return;
        }
        var lab = document.createElement("label");
        lab.textContent = a.label + " URL";
        lab.htmlFor = "url-" + a.id;
        var inp = document.createElement("input");
        inp.id = "url-" + a.id; inp.value = a.url || "";
        inp.autocapitalize = "off"; inp.spellcheck = false;
        inp.placeholder = a.hint || "https://… or ./page.html";
        wrap.appendChild(lab); wrap.appendChild(inp);
        if (a.hint) {
          var h = document.createElement("p");
          h.className = "note"; h.style.margin = "4px 0 0";
          h.style.fontSize = "12px"; h.textContent = a.hint;
          wrap.appendChild(h);
        }
      });
    }
    $("settings").classList.toggle("open", open);
  }
  $("saveModes").onclick = function () {
    var tokEl = $("maatToken");
    if (tokEl) {
      setWorkstationToken(tokEl.value);
      pushAuthToFrames();
    }
    modes.forEach(function (a) {
      if (a.kind === "about" || a.kind === "tools") return;
      var el = $("url-" + a.id);
      if (!el) return;
      a.url = (el.value || "").trim().replace(/\s+/g, "");
    });
    tools.forEach(function (t) {
      var el = $("url-" + t.id);
      if (!el) return;
      t.url = (el.value || "").trim().replace(/\s+/g, "");
    });
    saveModes(modes, tools);
    openSettings(false);
    build();
  };
  $("closeSettings").onclick = function () { openSettings(false); };

  // Deep links (allowlisted). Prefer hash for installable shortcuts; query still works.
  function applyDeepLink() {
    var mode = null;
    var lang = null;
    var input = null;
    var tool = null;
    try {
      var qs = new URLSearchParams(location.search);
      mode = qs.get("mode");
      lang = qs.get("lang");
      input = qs.get("input");
      tool = qs.get("tool");
    } catch (e) {}
    try {
      var raw = (location.hash || "").replace(/^#/, "");
      if (raw) {
        var hq = raw.indexOf("?");
        var hMode = hq < 0 ? raw : raw.slice(0, hq);
        var hParams = hq < 0 ? "" : raw.slice(hq + 1);
        if (hMode) mode = hMode;
        if (hParams) {
          var hp = new URLSearchParams(hParams);
          if (hp.get("lang")) lang = hp.get("lang");
          if (hp.get("input")) input = hp.get("input");
          if (hp.get("tool")) tool = hp.get("tool");
        }
      }
    } catch (e) {}

    // Allowlisted aliases only — unknown mode/lang/input/tool values are dropped.
    if (mode === "about") { mode = null; window.__maatOpenSettings = true; }
    if (mode === "languages") mode = "practice";
    if (mode === "listen") mode = "sermon";
    if (mode === "voice") { mode = "converse"; if (!input) input = "mic"; }
    if (mode === "assistant") { mode = "converse"; }
    if (mode === "music" || mode === "remarkable") {
      tool = mode;
      mode = "tools";
    }
    if (mode && !MODE_IDS[mode]) mode = null;

    if (input) {
      input = String(input).toLowerCase();
      if (input !== "mic" && input !== "type") input = null;
    }
    if (tool) {
      tool = String(tool).toLowerCase();
      if (!TOOL_IDS[tool]) tool = null;
    }

    if (mode && MODE_IDS[mode]) active = mode;

    if (lang) {
      lang = String(lang).toLowerCase();
      if (!PRACTICE_LANGS[lang]) lang = null;
    }
    if (lang) {
      modes.forEach(function (a) {
        if (a.id !== "practice") return;
        // Preserve Settings host; only set lang= on the existing URL.
        a.url = withQueryParam(a.url || "./languages.html", "lang", lang);
      });
      if (!mode) active = "practice";
    }

    if (input === "mic" || (mode === "converse" && input === "type")) {
      modes.forEach(function (a) {
        if (a.id !== "converse") return;
        // Preserve Settings host; toggle mode=mic without replacing the base URL.
        a.url = withQueryParam(
          a.url || "./assistant.html",
          "mode",
          input === "mic" ? "mic" : null
        );
      });
      if (!mode) active = "converse";
    }

    if (tool) {
      activeTool = tool;
      setLastTool(tool);
      if (!mode || mode === "tools") active = "tools";
    }
  }
  applyDeepLink();

  build();
  if (window.__maatOpenSettings) {
    window.__maatOpenSettings = false;
    openSettings(true);
  }
})();
</script>
</body>
</html>
